# Casablanca · cada vez que entra un cambio a main, se publica solo:
#   1. la base (los sql/0NN nuevos, una sola vez cada uno)
#   2. la función de invitados (marea-admin-personas)
#   3. la página en casablanca.fieldbuil.ai
# Necesita dos secretos en GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  (el sbp_… del .env)
#   CLOUDFLARE_API_TOKEN   (Cloudflare → My Profile → API Tokens → plantilla «Edit Cloudflare Workers»)
# Y la llave de la IA (una de las dos; se pasa sola al Worker en cada publicación):
#   GOOGLE_SA_JSON         (el contenido completo del .json de la cuenta de servicio de Vertex)
#   GEMINI_API_KEY         (la llave AIza… de aistudio.google.com/apikey)
# Si falta uno, ese paso se salta (no rompe los demás). También se puede correr a mano: Actions → Publicar → Run workflow.
name: Publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: mycgyvegfrdwbdcjuxse
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 0 · Cómo está hoy la IA y la página (diagnóstico, no cambia nada)
        continue-on-error: true
        run: |
          for U in https://casablanca.fieldbuil.ai https://marea.daniel-martinez9094.workers.dev; do
            echo "== $U"
            echo "versión publicada: $(curl -s -m 15 "$U/?v=$RANDOM" | grep -oE "BUILD_TAG='[^']+'" | head -1)"
            echo "IA: $(curl -s -m 15 "$U/api/ia/salud")"
            echo "IA (prueba real): $(curl -s -m 40 "$U/api/ia/salud?probar=1")"
          done
      - name: 1 · Base de datos
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: node scripts/conectar.mjs --ci
      - name: 2 · Función de invitados
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npx -y supabase@latest functions deploy marea-admin-personas --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: 3a · Llave de la IA al Worker (Vertex o Gemini)
        if: env.CLOUDFLARE_API_TOKEN != '' && (env.GOOGLE_SA_JSON != '' || env.GEMINI_API_KEY != '')
        run: |
          if [ -n "$GOOGLE_SA_JSON" ]; then
            printf '%s' "$GOOGLE_SA_JSON" | node -e 'let t="";process.stdin.on("data",c=>t+=c).on("end",()=>{const j=JSON.parse(t);if(j.type!=="service_account"||!j.private_key)throw new Error("GOOGLE_SA_JSON no es una cuenta de servicio");console.error("Vertex · proyecto "+j.project_id);process.stdout.write(Buffer.from(JSON.stringify(j)).toString("base64"))})' \
              | npx -y wrangler@4 secret put GOOGLE_SA_B64 --config wrangler.dominio.toml
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | tr -d ' \n\r' | npx -y wrangler@4 secret put GEMINI_API_KEY --config wrangler.dominio.toml
          fi
      - name: 3 · Página (casablanca.fieldbuil.ai)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler@4 deploy --config wrangler.dominio.toml
      - name: 4 · Verificar que la versión nueva ya se ve
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          TAG=$(grep -oE "BUILD_TAG='[^']+'" public/index.html | head -1 | cut -d"'" -f2)
          for i in 1 2 3 4 5 6; do
            if curl -s "https://casablanca.fieldbuil.ai/?v=$RANDOM" | grep -q "BUILD_TAG='$TAG'"; then echo "✓ Publicada la $TAG"; exit 0; fi
            sleep 10
          done
          echo "::warning::La página todavía no muestra la $TAG (puede ser caché, revisa en unos minutos)"
      - name: 5 · Prueba real de la IA ya publicada
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: echo "$(curl -s -m 40 "https://casablanca.fieldbuil.ai/api/ia/salud?probar=1")"
      - name: Resumen
        if: always()
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || echo "::warning::Falta el secreto SUPABASE_ACCESS_TOKEN: no se actualizó la base ni la función."
          [ -n "$CLOUDFLARE_API_TOKEN" ] || echo "::warning::Falta el secreto CLOUDFLARE_API_TOKEN: no se publicó la página."
          [ -n "$GOOGLE_SA_JSON$GEMINI_API_KEY" ] || echo "::notice::Sin GOOGLE_SA_JSON ni GEMINI_API_KEY en GitHub: la IA queda con la llave que ya tenga el Worker (si tiene)."
