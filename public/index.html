<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ART-START-->
<title>Marea Alta</title>
<meta name="description" content="El viaje a la playa: gastos compartidos, tareas y noches temáticas.">
<meta name="theme-color" content="#0B7A75">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna de 680px que vive en el celular; pestañas fijas abajo; todo lo que se edita sube en una hoja desde abajo.
   Día = arena mojada y agua turquesa. Noche (tema oscuro) = la playa a las 11 pm: azul profundo, el agua brilla, el coral es la fogata. */
:root{
  --bg:#E9F2F0; --surface:#FFFFFF; --surface-2:#F2F7F6; --ink:#0F2A31; --ink-2:#4A6770; --ink-3:#84A0A6; --line:#D3E3E0;
  --tide:#0B7A75; --tide-ink:#FFFFFF; --tide-soft:#D5EDEA; --tide-deep:#075A56;
  --sun:#E5532B; --sun-ink:#FFFFFF; --sun-soft:#FCE5DC;
  --ok:#1C8549; --ok-soft:#DCF1E4; --warn:#9A6512; --warn-soft:#FAEFD6; --bad:#BF3329; --bad-soft:#F8E0DC;
  --shadow:0 1px 2px rgba(15,42,49,.06),0 10px 28px rgba(15,42,49,.08);
  --scrim:rgba(8,24,30,.45);
  --f-disp:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08111F; --surface:#0F1B2E; --surface-2:#14233A; --ink:#E6EEF7; --ink-2:#A2B4C8; --ink-3:#6C809A; --line:#21324C;
    --tide:#35C2B6; --tide-ink:#04211F; --tide-soft:#0F3638; --tide-deep:#7FE3D9;
    --sun:#FF7A55; --sun-ink:#2A0E05; --sun-soft:#3A1E17;
    --ok:#4CC584; --ok-soft:#10301F; --warn:#E5B256; --warn-soft:#352913; --bad:#FF7C6F; --bad-soft:#3A1714;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#0F1B2E; --surface-2:#14233A; --ink:#E6EEF7; --ink-2:#A2B4C8; --ink-3:#6C809A; --line:#21324C;
  --tide:#35C2B6; --tide-ink:#04211F; --tide-soft:#0F3638; --tide-deep:#7FE3D9;
  --sun:#FF7A55; --sun-ink:#2A0E05; --sun-soft:#3A1E17;
  --ok:#4CC584; --ok-soft:#10301F; --warn:#E5B256; --warn-soft:#352913; --bad:#FF7C6F; --bad-soft:#3A1714;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
a{color:var(--tide)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--tide);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- estructura ---------- */
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-disp);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand small{display:block;color:var(--ink-3);font-size:12px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-btn{border:0;background:none;padding:0;cursor:pointer}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:680px;margin:0 auto;display:flex}
.tab{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-3);font-size:11px;font-weight:600;cursor:pointer;min-height:56px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--tide)}
.fab{position:fixed;right:max(16px,calc(50% - 324px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:31;width:58px;height:58px;border-radius:50%;border:0;background:var(--sun);color:var(--sun-ink);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center}
.fab svg{width:28px;height:28px}

/* ---------- piezas ---------- */
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap-ok{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 0 10px}
.sec-h h2{font-size:19px}
.sec-h .link{border:0;background:none;color:var(--tide);font-weight:600;cursor:pointer;padding:6px 0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.tiny{font-size:13px}
.btn{border:0;border-radius:12px;min-height:46px;padding:0 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--tide);color:var(--tide-ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:none;color:var(--tide);padding:0 8px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.chips.scroll::-webkit-scrollbar{display:none}.chips.scroll .chip{flex:none}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;min-height:36px;padding:0 13px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--tide);border-color:var(--tide);color:var(--tide-ink)}
.chip.sunny[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.tide{background:var(--tide-soft);color:var(--tide-deep)} .pill.sun{background:var(--sun-soft);color:var(--sun)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:38px;font-weight:700;font-size:14px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;padding:10px 12px;font-size:16px}
textarea.in{min-height:96px;resize:vertical}
.in:focus{outline:2px solid var(--tide);outline-offset:0;border-color:transparent}
.in.flag{border-color:var(--warn);background:var(--warn-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;overflow:hidden;font-family:var(--f-disp)}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:64px;height:64px;font-size:24px}
.av.xs{width:24px;height:24px;font-size:11px}
.avs{display:flex}.avs .av{margin-left:-6px;border:2px solid var(--surface)}.avs .av:first-child{margin-left:0}
.empty{text-align:center;padding:28px 16px;color:var(--ink-2)}
.empty svg{width:56px;height:56px;color:var(--ink-3);margin-bottom:6px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;min-width:0;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-family:var(--f-disp);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cat-dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--tide-soft);color:var(--tide-deep)}
.cat-dot svg{width:20px;height:20px}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.tide{background:var(--tide-soft);color:var(--tide-deep)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.foot{color:var(--ink-3);font-size:12px;text-align:center;margin-top:28px}

/* ---------- hero del día (la marea sube con el viaje) ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;background:var(--tide);color:var(--tide-ink);padding:20px 18px 18px;min-height:150px}
.hero h1{font-size:30px;line-height:1.05;font-weight:800}
.hero .sub{opacity:.85;font-size:14px;margin-top:4px}
.hero .big{font-family:var(--f-disp);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em}
.hero .wave{position:absolute;left:0;right:0;bottom:0;height:var(--lvl,18%);transition:height .8s ease}
.hero .wave svg{position:absolute;left:0;top:-14px;width:200%;height:16px;animation:drift 9s linear infinite}
.hero .wave .fill{position:absolute;inset:0;background:var(--tide-deep);opacity:.35}
.hero .in-hero{position:relative;z-index:1}
@keyframes drift{to{transform:translateX(-50%)}}
.saldo{display:flex;align-items:center;justify-content:space-between;gap:12px}
.saldo .amt{font-size:26px}
.pos{color:var(--ok)} .neg{color:var(--bad)}

/* ---------- balances ---------- */
.bal{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.bal:last-child{border-bottom:0}
.bar{height:6px;border-radius:3px;background:var(--surface-2);position:relative;margin-top:6px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.bar i.p{left:50%;background:var(--ok)} .bar i.n{right:50%;background:var(--bad)}
.tx{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tx:last-child{border-bottom:0}

/* ---------- tareas ---------- */
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;align-items:start}
.col h3{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tcard{background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);border:0;width:100%;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.tcard .t{font-weight:700}
.tcard.done .t{text-decoration:line-through;color:var(--ink-3)}
.prog{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}.prog i{display:block;height:100%;background:var(--tide)}
.sub-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sub-item input{width:22px;height:22px;accent-color:var(--tide)}

/* ---------- eventos ---------- */
.day{margin-top:18px}
.day-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.day-h b{font-family:var(--f-disp);font-size:20px}
.ev{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);border:0;width:100%;text-align:left;cursor:pointer}
.ev .blk{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding-top:3px}
.ev.noche{background:linear-gradient(135deg,var(--surface) 55%,var(--sun-soft))}
.ev .t{font-family:var(--f-disp);font-weight:700;font-size:17px;line-height:1.2}
.prop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.vote{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:56px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-weight:800;color:var(--ink-2)}
.vote svg{width:20px;height:20px}
.vote[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}

/* ---------- nosotros ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);border:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--sun);background:var(--sun-soft);border-radius:999px;padding:2px 8px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:15px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}

/* ---------- hoja inferior ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--scrim)}
.sheet-card{position:relative;width:100%;max-width:680px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sheet-h h2{flex:1;font-size:22px}
.x{border:0;background:var(--surface-2);width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.x svg{width:20px;height:20px}
.add-opt{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:0;border-radius:14px;padding:12px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.add-opt .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tide-soft);color:var(--tide-deep)}
.add-opt .ic.s{background:var(--sun-soft);color:var(--sun)}
.add-opt .ic svg{width:22px;height:22px}
.add-opt b{display:block}
.thumb{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:var(--surface-2)}
.pin-big{font-family:var(--f-disp);font-weight:800;font-size:56px;letter-spacing:.2em;text-align:center;color:var(--tide)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.table-x{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-inline:20px;padding-block:32px;max-width:420px;margin:0 auto;gap:22px}
.login h1{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.03em}
.login .tag{font-size:17px;color:var(--ink-2)}
.pin-in{letter-spacing:.5em;font-size:24px;text-align:center;font-family:var(--f-disp);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" onclick="closeSheet()"></div>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grip"></div><div id="sheetBody"></div></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
/* ============================================================================
   MAREA ALTA · marea.fieldbuil.ai
   Un solo archivo. Dos motores de datos con la misma interfaz:
     · DEMO      → todo en este navegador (localStorage). Sirve para ver y probar ya.
     · SUPABASE  → proyecto compartido fieldbuilt-lab, esquema `marea`.
   Para conectar Supabase: pegar SB_URL y SB_ANON abajo (son públicas por diseño;
   la seguridad la hace RLS en sql/001_esquema.sql). La service_role JAMÁS va aquí.
   ============================================================================ */
const BUILD_TAG='v1';
const SB_URL='';   // ← Project URL de fieldbuilt-lab, ej. https://abcd.supabase.co
const SB_ANON='';  // ← anon public key de fieldbuilt-lab
const MODO=(SB_URL&&SB_ANON&&window.supabase)?'supabase':'demo';
const APP_URL='https://marea.fieldbuil.ai';

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'x'+Math.random().toString(16).slice(2)+Date.now().toString(16));
const r2=n=>Math.round((+n+Number.EPSILON)*100)/100;
const hoyISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDias=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const difDias=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const fechaCorta=iso=>{if(!iso)return'';const[y,m,d]=iso.split('-');return(+d)+' '+MESES[+m-1]};
const diaSem=iso=>DIAS[new Date(iso+'T12:00:00').getDay()];
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function money(n){try{return new Intl.NumberFormat('es-EC',{style:'currency',currency:CFG.moneda||'USD'}).format(+n||0)}catch(e){return'$'+(+n||0).toFixed(2)}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}
async function copiar(txt,okMsg){try{await navigator.clipboard.writeText(txt);toast(okMsg||'Copiado')}catch(e){toast('Mantén presionado el texto para copiarlo')}}

/* ============================================================================
   CÁLCULOS (iguales a las vistas SQL vw_gasto_partes / vw_balances / vw_fondo)
   ============================================================================ */
function partesDe(g){
  const ps=(g.reparto&&g.reparto.partes)||[]; const n=ps.length; if(!n) return [];
  const modo=g.reparto.modo, m=+g.monto||0;
  if(modo==='igual'){const base=Math.floor(m*100/n)/100; const resto=r2(m-base*n); return ps.map((p,i)=>({id:p.persona_id,v:i===0?r2(base+resto):base}))}
  if(modo==='porcentaje') return ps.map(p=>({id:p.persona_id,v:r2(m*(+p.valor||0)/100)}));
  return ps.map(p=>({id:p.persona_id,v:r2(+p.valor||0)}));
}
function miParte(g){const x=partesDe(g).find(p=>p.id===ME.id);return x?x.v:0}
/* lo que este gasto me deja: + me deben (presté), − debo. Igual que la columna derecha de Splitwise */
function miNeto(g){if(g.eliminado||g.fondo)return 0;const pague=(g.pagadores||[]).filter(x=>x.persona_id===ME.id).reduce((a,x)=>a+(+x.monto||0),0);return r2(pague-miParte(g))}
function balances(){
  const B={}; activos().forEach(p=>B[p.id]={id:p.id,pagado:0,toca:0});
  for(const g of GASTOS){ if(g.eliminado||g.fondo) continue;
    for(const x of (g.pagadores||[])){ if(!B[x.persona_id]) B[x.persona_id]={id:x.persona_id,pagado:0,toca:0}; B[x.persona_id].pagado=r2(B[x.persona_id].pagado+(+x.monto||0)) }
    for(const x of partesDe(g)){ if(!B[x.id]) B[x.id]={id:x.id,pagado:0,toca:0}; B[x.id].toca=r2(B[x.id].toca+x.v) }
  }
  return Object.values(B).map(b=>({...b,saldo:r2(b.pagado-b.toca)}));
}
function simplificar(bs){
  const deb=bs.filter(b=>b.saldo<-0.009).map(b=>({id:b.id,s:-b.saldo})).sort((a,b)=>b.s-a.s);
  const acr=bs.filter(b=>b.saldo>0.009).map(b=>({id:b.id,s:b.saldo})).sort((a,b)=>b.s-a.s);
  const out=[]; let i=0,j=0;
  while(i<deb.length&&j<acr.length){const m=Math.min(deb[i].s,acr[j].s); if(m>0.009) out.push({de:deb[i].id,a:acr[j].id,monto:r2(m)}); deb[i].s-=m; acr[j].s-=m; if(deb[i].s<0.009)i++; if(acr[j].s<0.009)j++}
  return out;
}
function fondo(){
  let ap=0,ga=0; for(const g of GASTOS){ if(g.eliminado) continue; if(g.tipo==='aporte') ap+=+g.monto; if(g.fondo) ga+=+g.monto }
  return {aportado:r2(ap),gastado:r2(ga),disponible:r2(ap-ga)};
}

/* ---------- lectura rápida sin IA (respaldo del modo demo y si la IA falla) ---------- */
function buscarPersonas(txt){
  const t=norm(txt); if(!t) return {ids:[],dudas:[]};
  const ids=[],dudas=[];
  for(const trozo of t.split(/,| y | e /).map(s=>s.trim()).filter(Boolean)){
    const c=activos().filter(p=>{const n=norm(p.nombre),a=norm(p.apodo||'').replace(/[^a-z ]/g,'').trim();return n===trozo||a===trozo||n.split(' ')[0]===trozo||(a&&a.split(' ')[0]===trozo)||n.startsWith(trozo+' ')});
    if(c.length===1) ids.push(c[0].id); else if(c.length>1) dudas.push(`"${trozo}" puede ser ${c.map(p=>p.nombre).join(', ')}: elige a mano`);
    else if(/^nati/.test(trozo)) dudas.push(`"${trozo}" puede ser cualquiera de las Natalias: elige a mano`);
  }
  return {ids,dudas};
}
function leerLocal(texto,conFoto){
  const t=String(texto||'').trim(), prop={gastos:[],tareas:[],eventos:[],resumen:'',local:true};
  const mm=t.match(/(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?)/);
  if(mm||conFoto){
    let monto=mm?leerMonto(mm[1]):0;
    let desc=''; const dm=t.match(/(?:\bde\b|\ben\b|\bpor\b|\bpara la\b)\s+([^,.;]+?)(?=\s*(?:,|\.|;|$|\bpara\b|\bva\b|\bmenos\b|\bsin\b|\bexcepto\b|\bentre\b))/i);
    if(dm) desc=dm[1].replace(/\b(d[oó]lares|usd|pesos|plata)\b/ig,'').trim();
    if(!desc) desc=t.replace(mm?mm[0]:'','').replace(/\b(pagu[ée]|pag[óo]|d[oó]lares|usd|\$)\b/ig,'').replace(/\s+/g,' ').trim().slice(0,50);
    desc=desc.charAt(0).toUpperCase()+desc.slice(1);
    const dudas=[]; let pagador=ME.id;
    const pm=t.match(/\bpag[óo]\s+([a-záéíóúñ ]+?)(?=\s*(?:,|\.|$|\d|\bde\b|\ben\b|\bpor\b))/i);
    if(pm){const r=buscarPersonas(pm[1]);if(r.ids[0])pagador=r.ids[0];dudas.push(...r.dudas)}
    let part=activos().map(p=>p.id);
    const sm=t.match(/\b(?:solo|s[oó]lo|entre)\s+([a-záéíóúñ ,]+?)(?=\s*(?:\.|;|$|\bmenos\b))/i);
    if(sm){const r=buscarPersonas(sm[1]);if(r.ids.length){part=r.ids;if(!part.includes(pagador)&&/\bentre\b/i.test(sm[0]))part.push(pagador)}dudas.push(...r.dudas)}
    const xm=t.match(/\b(?:menos|sin|excepto|salvo)\s+([a-záéíóúñ ,]+?)(?=\s*(?:\.|;|$))/i);
    if(xm){const r=buscarPersonas(xm[1]);part=part.filter(id=>!r.ids.includes(id));dudas.push(...r.dudas)}
    const cat=categoriaDe(t);
    if(!monto) dudas.push(conFoto?'Sin conexión a la IA todavía: escribe el total de la factura.':'No encontré el monto: escríbelo.');
    prop.gastos.push({descripcion:desc||'Gasto',monto,fecha:null,categoria:cat,pagador_ids:[pagador],participante_ids:part,modo:'igual',partes:null,evento_id:null,etiquetas:[],confianza:monto?0.7:0.1,dudas});
    prop.resumen='Lectura rápida en el teléfono (sin IA). Revisa antes de guardar.';
  } else if(t){
    const items=(t.includes('\n')?t.split('\n'):t.split(/[;,]/)).map(s=>s.replace(/^[\s\-–•*\d.)]+/,'').trim()).filter(s=>s.length>1);
    items.forEach(s=>{let resp=null;const rm=s.match(/^([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)\s+(?=(prende|lleva|compra|trae|hace|arma|cocina|maneja|organiza))/);if(rm){const r=buscarPersonas(rm[1]);resp=r.ids[0]||null}
      prop.tareas.push({titulo:s.charAt(0).toUpperCase()+s.slice(1),detalle:null,grupo:grupoDe(s),responsable_id:resp,fecha:null,evento_id:null,etiquetas:[],subtareas:[]})});
    prop.resumen=`Encontré ${prop.tareas.length} tarea${prop.tareas.length===1?'':'s'}. Marca las que quieres crear.`;
  }
  return prop;
}
/* "1.250,50" · "1,250.50" · "45,50" · "1.250" → número. El último separador con 1-2 decimales es el decimal. */
function leerMonto(s){const pt=s.lastIndexOf('.'),cm=s.lastIndexOf(',');
  if(pt>=0&&cm>=0){const dec=pt>cm?'.':',';s=s.split(dec==='.'?',':'.').join('');s=s.replace(dec,'.')}
  else{const sep=pt>=0?'.':cm>=0?',':'';if(sep){const partes=s.split(sep);s=(partes.length>2||partes[partes.length-1].length===3)?partes.join(''):partes.join('.')}}
  return r2(parseFloat(s)||0)}
function categoriaDe(t){t=norm(t);
  if(/hielo|cerveza|ron|trago|vino|whisky|aguardiente|michelada|bebida|cola|agua/.test(t))return'bebidas';
  if(/mercado|super|tienda|despensa|frutas|verdura/.test(t))return'mercado';
  if(/gasolina|taxi|uber|bus|peaje|parqueadero|vuelo|pasaje|carro/.test(t))return'transporte';
  if(/casa|hotel|airbnb|hospedaje|cabana|arriendo/.test(t))return'hospedaje';
  if(/lancha|tour|entrada|surf|snorkel|kayak|clase/.test(t))return'actividades';
  if(/comida|almuerzo|cena|desayuno|taco|pizza|pescado|camaron|carne|asado|restaurante/.test(t))return'comida';
  return'otros'}
function grupoDe(t){t=norm(t);
  if(/compra|comprar|mercado|super/.test(t))return'Compras';
  if(/cerveza|hielo|trago|ron|bebida/.test(t))return'Bebidas';
  if(/cocina|cocinar|carne|asado|desayuno|almuerzo|cena|comida|parrilla/.test(t))return'Comida';
  if(/limpiar|lavar|basura|casa|cuarto|camas/.test(t))return'Casa';
  if(/playlist|juego|karaoke|actividad|torneo|disfraz/.test(t))return'Actividades';
  return'Logística'}

    </div><div class="wave"><svg viewBox="0 0 400 16" preserveAspectRatio="none"><path d="M0 8 Q25 0 50 8 T100 8 T150 8 T200 8 T250 8 T300 8 T350 8 T400 8 V16 H0Z" fill="var(--tide-deep)" opacity=".35"/></svg><div class="fill"></div></div></section>

/* la temática de esta noche (o la próxima) en grande: lo primero que la gente quiere saber */
function nocheDestacada(hoy){return EVENTOS.filter(e=>(e.estado==='oficial'||e.estado==='hecho')&&e.bloque==='noche'&&e.dia&&e.dia>=hoy).sort((a,b)=>a.dia.localeCompare(b.dia))[0]}
function nocheCard(hoy){
  const n=nocheDestacada(hoy);
  if(!n) return '';
  const cuando=n.dia===hoy?'Esta noche':n.dia===addDias(hoy,1)?'Mañana en la noche':`${diaSem(n.dia)} ${fechaCorta(n.dia)}`;
  return `<button class="card ev noche" style="margin-top:14px;display:block;width:100%;grid-template-columns:none" onclick="abrirEvento('${n.id}')"><div class="eyebrow" style="color:var(--sun)">${cuando} · ${esc(n.tematica||'Temática')}</div>
    <div style="font-family:var(--f-disp);font-weight:800;font-size:24px;line-height:1.1;margin-top:4px">${esc(n.titulo)}</div>
    <div class="row wrap-ok" style="gap:6px;margin-top:8px">${n.dress_code?`<span class="pill sun">Vístete: ${esc(n.dress_code)}</span>`:''}${n.hora?`<span class="pill">${esc(String(n.hora).slice(0,5))}</span>`:''}</div>
    ${(n.menu||[]).length?`<div class="tiny" style="margin-top:8px"><b>Menú:</b> <span class="muted">${n.menu.map(esc).join(' · ')}</span></div>`:''}</button>`;
}
const ordBloque=e=>({manana:1,tarde:2,noche:3}[e.bloque]||4);

  const n=miNeto(g), part=(g.pagadores||[]).some(x=>x.persona_id===ME.id)||partesDe(g).some(x=>x.id===ME.id);

function validarF(){
  const m=r2(parseFloat(String(F.monto).replace(',','.'))||0);
  if(!String(F.descripcion).trim()) return 'Falta la descripción';
  if(!(m>0)) return 'Escribe un monto mayor que cero';
  if(F.fondo&&F.tipo==='gasto') return '';
  if(!F.part.length) return 'Elige entre quiénes se reparte';
  if(F.modo==='porcentaje'){const s=r2(F.part.reduce((a,id)=>a+(+F.valores[id]||0),0));if(Math.abs(s-100)>0.01)return `Los porcentajes suman ${s}%, deben sumar 100%`}
  if(F.modo==='monto'){const s=r2(F.part.reduce((a,id)=>a+(+F.valores[id]||0),0));if(Math.abs(s-m)>0.01)return `Las partes suman ${money(s)}, deben sumar ${money(m)}`}
  return '';
}

function togglePart(id){F.part=F.part.includes(id)?F.part.filter(x=>x!==id):[...F.part,id];pintarFormGasto()}

function cambiarModo(m){F.modo=m;const n=F.part.length||1,monto=r2(parseFloat(String(F.monto).replace(',','.'))||0);F.part.forEach((id,i)=>{if(F.valores[id]==null||F.valores[id]===''||F.modo!==m)F.valores[id]=m==='porcentaje'?r2(100/n):r2(monto/n)});
  if(m==='porcentaje'){const s=r2(F.part.reduce((a,id)=>a+(+F.valores[id]||0),0));if(F.part[0]&&Math.abs(s-100)>0.01&&Math.abs(s-100)<1)F.valores[F.part[0]]=r2(+F.valores[F.part[0]]+100-s)}

function achicar(file,lado,q){return new Promise((ok,mal)=>{const r=new FileReader();r.onerror=()=>mal(new Error('No pude leer la foto'));r.onload=()=>{const im=new Image();im.onerror=()=>mal(new Error('Ese archivo no es una imagen'));im.onload=()=>{const k=Math.min(1,lado/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const dataUrl=c.toDataURL('image/jpeg',q);c.toBlob(blob=>ok({blob,dataUrl}),'image/jpeg',q)};im.src=r.result};r.readAsDataURL(file)})}

function addLista(id){const v=$('#nli').value.trim();if(!v)return;const e=EVENTOS.find(x=>x.id===id);patchEvento(id,{lista:[...(e.lista||[]),{txt:v,ok:false}]})}
async function listaATareas(id){const e=EVENTOS.find(x=>x.id===id);const lista=[...(e.lista||[])];let n=0;
  try{for(const it of lista){if(it.tarea_id||it.ok)continue;const tid=uid();await API.saveTarea({id:tid,titulo:it.txt,detalle:'Para '+e.titulo,grupo:grupoDe(it.txt+' compra'),estado:'por_hacer',responsable:null,evento_id:e.id,fecha:e.dia||null,etiquetas:[],subtareas:[],creado_por:ME.id},true);it.tarea_id=tid;n++}
    await patchEvento(id,{lista});toast(`${n} tarea${n===1?' creada':'s creadas'}`)}catch(err){toast(err.message)}}
async function borrarEvento(id,btn){if(btn.dataset.ok!=='1'){btn.dataset.ok='1';btn.textContent='Toca otra vez para eliminar';return}try{await API.borrarEvento(id);await cargar();closeSheet();toast('Plan eliminado');render()}catch(e){toast(e.message)}}
function abrirFormEvento(id,pre){
  const e=id?EVENTOS.find(x=>x.id===id):{id:uid(),titulo:'',tematica:'',descripcion:'',bloque:'noche',lugar:'',dress_code:'',playlist_url:'',dia:null,hora:null,estado:'propuesta',anfitriones:[ME.id],etiquetas:[],lista:[],menu:[],...(pre||{})};
  window.EF={...e,nuevo:!id};
  const fld=(k,l,ph='')=>`<div class="field"><label for="ef_${k}">${l}</label><input id="ef_${k}" class="in" value="${esc(e[k]||'')}" placeholder="${ph}" oninput="EF.${k}=this.value"></div>`;
  openSheet(`${sheetH(id?'Editar plan':'Proponer un plan')}<div class="stack">
    ${fld('titulo','Nombre','Ej. Noche de karaoke')}${fld('tematica','Temática','Ej. Karaoke, parrillada, juegos')}
    <div class="field"><label for="ef_desc">De qué se trata</label><textarea id="ef_desc" class="in" rows="3" oninput="EF.descripcion=this.value">${esc(e.descripcion||'')}</textarea></div>
    <div class="field"><span class="lbl">Momento del día</span><div class="seg">${BLOQUES.map(([k,l])=>`<button aria-pressed="${e.bloque===k}" onclick="EF.bloque='${k}';this.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===this))">${l}</button>`).join('')}</div></div>
    <div class="grid2">${fld('lugar','Dónde','casa, playa, terraza')}${fld('dress_code','Dress code','Ej. todo blanco')}</div>
    <div class="field"><label for="ef_menu">Menú (un plato por línea)</label><textarea id="ef_menu" class="in" rows="4" placeholder="Tacos de camarón&#10;Guacamole&#10;Micheladas" oninput="EF.menu=this.value.split('\n').map(x=>x.trim()).filter(Boolean)">${esc((e.menu||[]).join('\n'))}</textarea></div>
    ${fld('playlist_url','Playlist (link)','https://open.spotify.com/…')}
    ${esAdmin()&&e.estado!=='propuesta'?`<div class="grid2"><div class="field"><label for="ef_dia">Día</label><select id="ef_dia" class="in" onchange="EF.dia=this.value||null"><option value="">Sin día</option>${diasViaje().map((d,i)=>`<option value="${d}" ${e.dia===d?'selected':''}>Día ${i+1} · ${fechaCorta(d)}</option>`).join('')}</select></div><div class="field"><label for="ef_hora">Hora</label><input id="ef_hora" type="time" class="in" value="${esc(e.hora?String(e.hora).slice(0,5):'')}" onchange="EF.hora=this.value||null"></div></div>`:''}
    <button class="btn primary block" onclick="guardarEvento()">${id?'Guardar':'Proponer'}</button></div>`);
}
async function guardarEvento(){if(!String(EF.titulo).trim()){toast('Ponle un nombre');return}const n=EF.nuevo;const e={...EF};delete e.nuevo;if(n)e.creado_por=ME.id;try{await API.saveEvento(e,n);await cargar();closeSheet();toast(n?'Propuesta creada: que voten':'Plan actualizado');if(n){SUBE='propuestas';TAB='planes'}render()}catch(err){toast(err.message)}}

/* ---------- NOSOTROS ---------- */
function insignias(){
  const bs=balances(),out={};const add=(id,t)=>{if(id)(out[id]=out[id]||[]).push(t)};
  const top=bs.slice().sort((a,b)=>b.pagado-a.pagado)[0]; if(top&&top.pagado>0) add(top.id,'El que más ha pagado');
  const anf={};EVENTOS.forEach(e=>(e.anfitriones||[]).forEach(a=>anf[a]=(anf[a]||0)+1));const ta=Object.entries(anf).sort((a,b)=>b[1]-a[1])[0];if(ta&&ta[1]>1)add(ta[0],'Anfitrión estrella');
  const lis={};TAREAS.filter(t=>t.estado==='listo'&&t.responsable).forEach(t=>lis[t.responsable]=(lis[t.responsable]||0)+1);const tl=Object.entries(lis).sort((a,b)=>b[1]-a[1])[0];if(tl)add(tl[0],'Manos a la obra');
  return out;
}
function vNosotros(){
  const ins=insignias(), conAlergias=activos().filter(p=>p.perfil&&p.perfil.alergias);
  return `<div class="row" style="margin-bottom:14px"><div class="grow"><h2 style="font-size:24px">${activos().length} en el viaje</h2><div class="muted tiny">Toca a alguien para ver su ficha.</div></div><button class="btn sm primary" onclick="abrirMiPerfil()">Mi ficha</button></div>
    ${conAlergias.length?`<div class="banner warn" style="margin-bottom:14px"><div><b>Ojo en la cocina:</b> ${conAlergias.map(p=>`${esc(nom(p.id))} (${esc(p.perfil.alergias)})`).join(', ')}</div></div>`:''}
    <div class="people">${activos().map(p=>{const pf=p.perfil||{};return `<button class="pcard" onclick="abrirPersona('${p.id}')">${av(p.id,'lg')}<div style="min-width:0"><div class="n">${esc(nom(p.id))}</div><div class="muted tiny" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(pf.superpoder||pf.ciudad||'Ficha sin llenar')}</div></div>${(ins[p.id]||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</button>`}).join('')}</div>`;
}
function abrirPersona(id){
  const p=PMAP[id]; if(!p) return; const pf=p.perfil||{}, ins=insignias()[id]||[];
  const filas=[['Cumpleaños',pf.cumple?fechaCorta(pf.cumple):''],['Ciudad',pf.ciudad],['Alergias o restricciones',pf.alergias],['Bebida favorita',pf.bebida],['Su canción de karaoke',pf.cancion],['Juego favorito',pf.juego],['Talla de camiseta',pf.talla],['Superpoder en el viaje',pf.superpoder]].filter(f=>f[1]);
  openSheet(`${sheetH('')}<div class="stack" style="margin-top:-30px"><div class="row">${av(id,'lg')}<div class="grow"><h2 style="font-size:26px">${esc(nom(id))}</h2><div class="muted">${esc(p.nombre)}${p.rol==='admin'?' · organiza':''}</div></div></div>
    ${ins.length?`<div class="chips">${ins.map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div>`:''}
    ${pf.bio?`<p style="margin:0">${esc(pf.bio)}</p>`:''}
    ${filas.length?`<div class="card"><dl class="kv">${filas.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`:`<div class="card flat empty">${id===ME.id?'Tu ficha está vacía.':'Todavía no ha llenado su ficha.'}</div>`}
    ${id===ME.id?`<button class="btn primary block" onclick="abrirMiPerfil()">Editar mi ficha</button>`:''}</div>`);
}
function abrirMiPerfil(){
  const pf={...(ME.perfil||{})}; window.PF={apodo:ME.apodo||'',perfil:pf};
  const t=(k,l,ph='',type='text')=>`<div class="field"><label for="pf_${k}">${l}</label><input id="pf_${k}" class="in" type="${type}" value="${esc(pf[k]||'')}" placeholder="${ph}" oninput="PF.perfil.${k}=this.value"></div>`;
  openSheet(`${sheetH('Mi ficha')}<div class="stack">
    <div class="row">${av(ME.id,'lg')}<label class="btn sm">${ic('cam')} ${pf.foto?'Cambiar foto':'Poner foto'}<input type="file" accept="image/*" hidden onchange="fotoPerfil(this)"></label></div>
    <div class="field"><label for="pf_apodo">Cómo te dicen</label><input id="pf_apodo" class="in" value="${esc(ME.apodo||'')}" placeholder="${esc((ME.nombre||'').split(' ')[0])}" oninput="PF.apodo=this.value"></div>
    <div class="grid2">${t('cumple','Cumpleaños','','date')}${t('ciudad','Ciudad','Ej. Quito')}</div>
    ${t('alergias','Alergias o comida que no comes','Ej. mariscos, lactosa')}
    <div class="grid2">${t('bebida','Bebida favorita','Ej. michelada')}${t('juego','Juego de mesa favorito','Ej. Risk')}</div>
    ${t('cancion','Tu canción de karaoke','La que te sabes completa')}
    <div class="field"><span class="lbl">Talla de camiseta</span><div class="chips">${TALLAS.map(x=>`<button class="chip" aria-pressed="${pf.talla===x}" onclick="PF.perfil.talla='${x}';this.parentElement.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===this))">${x}</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">Tu superpoder en el viaje</span><div class="chips">${SUPERPODERES.map(x=>`<button class="chip sunny" aria-pressed="${pf.superpoder===x}" onclick="PF.perfil.superpoder='${x}';this.parentElement.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===this))">${x}</button>`).join('')}</div></div>
    <div class="field"><label for="pf_bio">Algo sobre ti</label><textarea id="pf_bio" class="in" rows="3" oninput="PF.perfil.bio=this.value">${esc(pf.bio||'')}</textarea></div>
    <button class="btn primary block" onclick="guardarPerfil()">Guardar mi ficha</button>
    <div class="row"><button class="btn grow" onclick="cambiarTema()">${ic('moon')} Tema día / noche</button><button class="btn danger" onclick="salir()">${ic('out')} Salir</button></div>
    ${MODO==='demo'?`<button class="btn ghost" onclick="Demo.reiniciar();salir()">Reiniciar datos de demo</button>`:''}</div>`);
}
async function fotoPerfil(inp){const f=inp.files&&inp.files[0];if(!f)return;try{const{blob,dataUrl}=await achicar(f,512,.85);PF.perfil.foto=MODO==='demo'?dataUrl:await API.subirFoto('marea-perfiles',blob,dataUrl);if(MODO!=='demo')FOTOS[PF.perfil.foto]=dataUrl;await guardarPerfil(true)}catch(e){toast(e.message)}}
async function guardarPerfil(seguir){try{await API.saveMiPerfil(PF.apodo.trim(),PF.perfil);await cargar();toast('Ficha guardada');if(seguir)abrirMiPerfil();else{closeSheet();render()}}catch(e){toast(e.message)}}

/* ---------- ADMIN ---------- */
let ADM=null;
function vAdmin(){
  if(!esAdmin()) return '';
  if(!ADM){API.admin('listar').then(r=>{ADM=r.personas;render()}).catch(e=>{ADM=[];toast(e.message)});return `<div class="card flat empty">Cargando invitados…</div>`}
  const L=ADM.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  return `<div class="sec-h" style="margin-top:4px"><h2>Invitados · ${L.filter(p=>p.activo).length}</h2><button class="link" onclick="abrirNuevoInvitado()">+ Agregar</button></div>
    <div class="card"><div class="list">${L.map(p=>`<button class="item" onclick="abrirInvitado('${p.id}')">${av(p.id)}<div class="grow"><div class="t">${esc(p.nombre)}${p.rol==='admin'?' <span class="pill tide">admin</span>':''}${p.activo?'':' <span class="pill bad">bloqueado</span>'}</div><div class="s num">${esc(p.cedula)} · ${p.ultimo_acceso?'entró '+fechaCorta(String(p.ultimo_acceso).slice(0,10)):'nunca ha entrado'}</div></div></button>`).join('')}</div></div>
    <div class="row wrap-ok" style="margin-top:10px"><button class="btn sm" onclick="abrirCargaMasiva()">${ic('list')} Cargar varios</button></div>
    <div class="sec-h"><h2>El viaje</h2></div>
    <div class="card stack">
      <div class="field"><label for="cv_n">Nombre</label><input id="cv_n" class="in" value="${esc(CFG.nombre||'')}"></div>
      <div class="field"><label for="cv_l">Lugar</label><input id="cv_l" class="in" value="${esc(CFG.lugar||'')}" placeholder="Ej. Montañita, Ecuador"></div>
      <div class="grid2"><div class="field"><label for="cv_d">Desde</label><input id="cv_d" type="date" class="in" value="${esc(CFG.desde||'')}"></div><div class="field"><label for="cv_h">Hasta</label><input id="cv_h" type="date" class="in" value="${esc(CFG.hasta||'')}"></div></div>
      <div class="field"><label for="cv_m">Moneda</label><select id="cv_m" class="in">${['USD','COP','EUR'].map(m=>`<option ${CFG.moneda===m?'selected':''}>${m}</option>`).join('')}</select></div>
      ${CFG.ejemplo?'<div class="banner warn tiny">Estas fechas son de ejemplo. Pon las reales.</div>':''}
      <button class="btn primary" onclick="guardarViaje()">Guardar el viaje</button></div>
    <div class="sec-h"><h2>Respaldo</h2></div>
    <div class="card stack"><p class="muted tiny" style="margin:0">Copia completa de gastos, tareas, planes y votos en JSON.</p><button class="btn sm" onclick="respaldoJSON()">${ic('copy')} Ver respaldo</button></div>
    <p class="muted tiny" style="margin-top:14px">Motor de datos: <b>${MODO}</b>. ${MODO==='demo'?'Para que todos compartan los mismos datos hay que conectar Supabase (ver docs/ESTADO.md).':'Proyecto fieldbuilt-lab · esquema marea.'}</p>`;
}
function abrirNuevoInvitado(){
  openSheet(`${sheetH('Nuevo invitado')}<div class="stack">
    <div class="field"><label for="ni_n">Nombre completo</label><input id="ni_n" class="in" autofocus></div>
    <div class="field"><label for="ni_c">Cédula</label><input id="ni_c" class="in" inputmode="numeric"></div>
    <div class="grid2"><div class="field"><label for="ni_a">Apodo (opcional)</label><input id="ni_a" class="in"></div><div class="field"><label for="ni_t">WhatsApp (opcional)</label><input id="ni_t" class="in" inputmode="tel" placeholder="593…"></div></div>
    <div id="ni_e" class="banner bad" hidden></div>
    <button class="btn primary block" onclick="crearInvitado(this)">Crear y generar clave</button></div>`);
}
async function crearInvitado(btn){btn.disabled=true;try{const r=await API.admin('crear',{nombre:$('#ni_n').value,cedula:$('#ni_c').value,apodo:$('#ni_a').value,telefono:$('#ni_t').value});ADM=null;await cargar();mostrarPin(r.persona.nombre,r)}catch(e){btn.disabled=false;const x=$('#ni_e');x.hidden=false;x.textContent=e.message}}
function mostrarPin(nombre,r){
  openSheet(`${sheetH('Clave de '+esc(nombre.split(' ')[0]))}<div class="stack">
    <div class="card"><div class="eyebrow" style="text-align:center">Clave de 4 dígitos</div><div class="pin-big num">${esc(r.pin)}</div><p class="muted tiny" style="text-align:center;margin:0">Solo se muestra ahora. Si se pierde, generas otra.</p></div>
    <div class="field"><label for="wa_msg">Mensaje para WhatsApp</label><textarea id="wa_msg" class="in" rows="7" readonly onclick="this.select()">${esc(r.mensaje)}</textarea></div>
    <button class="btn primary block" onclick="copiar($('#wa_msg').value,'Mensaje copiado: pégalo en WhatsApp')">${ic('copy')} Copiar mensaje</button>
    ${r.wa_url?`<a class="btn sun block" href="${esc(r.wa_url)}" target="_blank" rel="noopener">${ic('wa')} Abrir WhatsApp</a>`:'<p class="muted tiny" style="margin:0">Si guardas su número, aparece el botón para abrir WhatsApp directo.</p>'}
    <button class="btn block" onclick="closeSheet();render()">Listo</button></div>`);
}
function abrirInvitado(id){
  const p=ADM.find(x=>x.id===id); if(!p) return;
  openSheet(`${sheetH(esc(p.nombre))}<div class="stack">
    <div class="card"><dl class="kv"><dt>Cédula</dt><dd class="num">${esc(p.cedula)}</dd><dt>Rol</dt><dd>${p.rol}</dd><dt>WhatsApp</dt><dd>${esc(p.telefono||'—')}</dd><dt>Último acceso</dt><dd>${p.ultimo_acceso?new Date(p.ultimo_acceso).toLocaleString('es-EC'):'Nunca'}</dd></dl></div>
    <div class="grid2"><div class="field"><label for="ei_a">Apodo</label><input id="ei_a" class="in" value="${esc(p.apodo||'')}"></div><div class="field"><label for="ei_t">WhatsApp</label><input id="ei_t" class="in" inputmode="tel" value="${esc(p.telefono||'')}"></div></div>
    <button class="btn block" onclick="editarInvitado('${p.id}')">Guardar cambios</button>
    <button class="btn primary block" onclick="nuevaClave('${p.id}',this)">Generar clave nueva</button>
    ${p.id!==ME.id?`<button class="btn ${p.activo?'danger':''} block" onclick="bloquear('${p.id}',${!p.activo})">${p.activo?'Bloquear acceso':'Desbloquear'}</button>`:''}</div>`);
}
async function editarInvitado(id){try{await API.admin('actualizar',{id,campos:{apodo:$('#ei_a').value.trim()||null,telefono:$('#ei_t').value.replace(/[^\d+]/g,'')||null}});ADM=null;await cargar();closeSheet();toast('Guardado');render()}catch(e){toast(e.message)}}
async function nuevaClave(id,btn){btn.disabled=true;try{const p=ADM.find(x=>x.id===id);const r=await API.admin('reset_pin',{id});mostrarPin(p.nombre,r)}catch(e){btn.disabled=false;toast(e.message)}}
async function bloquear(id,activo){try{await API.admin('toggle',{id,activo});ADM=null;await cargar();closeSheet();toast(activo?'Desbloqueado':'Bloqueado');render()}catch(e){toast(e.message)}}
function abrirCargaMasiva(){
  openSheet(`${sheetH('Cargar varios invitados')}<div class="stack"><p class="muted">Una persona por línea: <b>cédula, nombre, apodo, whatsapp</b>. Apodo y WhatsApp son opcionales.</p>
    <textarea id="cm" class="in" rows="8" placeholder="1712345678, Natalia Orquera, Nati O., 593991234567"></textarea>
    <button class="btn primary block" id="cmb" onclick="cargaMasiva()">Crear todos</button><div id="cmr"></div></div>`);
}
async function cargaMasiva(){
  const filas=$('#cm').value.split('\n').map(l=>l.split(',').map(s=>s.trim())).filter(f=>f[0]&&f[1]); const b=$('#cmb'); b.disabled=true; const out=[];
  for(const [cedula,nombre,apodo,telefono] of filas){try{const r=await API.admin('crear',{cedula,nombre,apodo,telefono});out.push({nombre,ok:true,r})}catch(e){out.push({nombre,ok:false,err:e.message})}}
  ADM=null; await cargar(); window.CM=out;
  $('#cmr').innerHTML=`<div class="card"><div class="list">${out.map((o,i)=>`<div class="item" style="cursor:default"><div class="grow"><div class="t">${esc(o.nombre)}</div><div class="s">${o.ok?'Clave '+esc(o.r.pin):esc(o.err)}</div></div>${o.ok?`<button class="btn sm" onclick="copiar(CM[${i}].r.mensaje,'Mensaje copiado')">${ic('copy')}</button>`:'<span class="pill bad">error</span>'}</div>`).join('')}</div></div>
    <button class="btn primary block" style="margin-top:10px" onclick="copiar(CM.filter(o=>o.ok).map(o=>o.r.mensaje).join('\\n\\n———\\n\\n'),'Todos los mensajes copiados')">Copiar todos los mensajes</button>`;
}
async function guardarViaje(){const c={nombre:$('#cv_n').value.trim()||'Marea Alta',lugar:$('#cv_l').value.trim(),desde:$('#cv_d').value||null,hasta:$('#cv_h').value||null,moneda:$('#cv_m').value};
  if(c.desde&&c.hasta&&c.hasta<c.desde){toast('La fecha final va después de la inicial');return}
  try{await API.saveConfig(c);await cargar();toast('Viaje guardado');render()}catch(e){toast(e.message)}}
function respaldoJSON(){const j=JSON.stringify({exportado:new Date().toISOString(),config:CFG,personas:PERSONAS,gastos:GASTOS,tareas:TAREAS,eventos:EVENTOS,votos:VOTOS,etiquetas:ETIQUETAS},null,1);
  openSheet(`${sheetH('Respaldo')}<div class="stack"><textarea class="in" rows="12" readonly onclick="this.select()">${esc(j)}</textarea><button class="btn primary block" onclick="copiar(this.previousElementSibling.value,'Respaldo copiado')">${ic('copy')} Copiar</button></div>`)}

/* ---------- service worker (solo en el sitio publicado) ---------- */
try{if('serviceWorker' in navigator&&/fieldbuil\.ai$|workers\.dev$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
boot();
</script>
