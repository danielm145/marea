<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="img/generadas.js"></script>
<script src="/api/config.js"></script>
<!--ART-START-->
<title>Casablanca · Same</title>
<meta name="description" content="El viaje a la playa: gastos compartidos, tareas y noches temáticas.">
<meta name="theme-color" content="#FFF9F1">
<meta name="color-scheme" content="light">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Dancing+Script:wght@600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna de 680px que vive en el celular; pestañas fijas abajo; todo lo que se edita sube en una hoja desde abajo.
   Solo tema claro (pedido de Daniel): arena, cielo al atardecer y mar turquesa, sacados del logo Casablanca. */
:root{
  /* de las fotos de la casa: paredes blancas, cojines y sombrilla azul Egeo, mar turquesa, buganvillas coral, sol */
  --bg:#FFF9F1; --surface:#FFFFFF; --surface-2:#FFF1DF; --ink:#0B2547; --ink-2:#4A6283; --ink-3:#8FA0B8; --line:#F1E4D2;
  --tide:#0A7FC0; --tide-ink:#FFFFFF; --tide-soft:#DDF1FB; --tide-deep:#0B5A8C;
  --mar:#14BDB6; --mar-soft:#D6F6F3;
  --sun:#FF7A2F; --sun-ink:#FFFFFF; --sun-soft:#FFE8D8;
  --sol:#FFC43D; --sol-soft:#FFF3CC;
  --ok:#0E8F6A; --ok-soft:#D8F3E8; --warn:#A86800; --warn-soft:#FFF0CF; --bad:#D6343B; --bad-soft:#FDE2E3;
  --shadow:0 1px 2px rgba(11,37,71,.05),0 10px 26px rgba(255,122,47,.10);
  --scrim:rgba(6,20,45,.5);
  --hero:linear-gradient(180deg,#5EC4EC 0%,#FFC86B 62%,#FF8A3D 100%);
  color-scheme:light;
  --f-disp:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:18px; --r-sm:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
a{color:var(--tide)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--tide);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- estructura ---------- */
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand svg{flex:none}
.logo{display:inline-block;flex:none;line-height:0}.logo svg{width:100%;height:100%;display:block}img.logo{border-radius:50%}
.login-logo{display:grid;place-items:center;margin:8px 0 2px}.login-logo .logo{filter:drop-shadow(0 14px 30px rgba(255,122,47,.25))}
.rapido{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rapido button{border:0;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);padding:12px 4px 10px;display:grid;justify-items:center;gap:6px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.rapido .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.rapido svg{width:22px;height:22px}
.brand b{font-family:var(--f-disp);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand small{display:block;color:var(--ink-3);font-size:12px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-btn{border:0;background:none;padding:0;cursor:pointer}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:680px;margin:0 auto;display:flex}
.tab{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-3);font-size:11px;font-weight:600;cursor:pointer;min-height:56px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--tide)}
.fab{position:fixed;right:max(16px,calc(50% - 324px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:31;width:58px;height:58px;border-radius:50%;border:0;background:var(--sun);color:var(--sun-ink);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center}
.fab svg{width:28px;height:28px}

/* ---------- piezas ---------- */
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap-ok{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 0 10px}
.sec-h h2{font-size:19px}
.sec-h .link{border:0;background:none;color:var(--tide);font-weight:600;cursor:pointer;padding:6px 0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.tiny{font-size:13px}
.btn{border:0;border-radius:12px;min-height:46px;padding:0 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--tide);color:var(--tide-ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:none;color:var(--tide);padding:0 8px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.chips.scroll::-webkit-scrollbar{display:none}.chips.scroll .chip{flex:none}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;min-height:36px;padding:0 13px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--tide);border-color:var(--tide);color:var(--tide-ink)}
.chip.sunny[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.mar{background:var(--mar-soft);color:var(--mar)}.pill.sol{background:var(--sol-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.tide{background:var(--tide-soft);color:var(--tide-deep)} .pill.sun{background:var(--sun-soft);color:var(--sun)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:38px;font-weight:700;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap;padding:0 12px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;padding:10px 12px;font-size:16px}
textarea.in{min-height:96px;resize:vertical}
.in:focus{outline:2px solid var(--tide);outline-offset:0;border-color:transparent}
.in.flag{border-color:var(--warn);background:var(--warn-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;overflow:hidden;font-family:var(--f-disp)}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:64px;height:64px;font-size:24px}
.av.xs{width:24px;height:24px;font-size:11px}
.avs{display:flex}.avs .av{margin-left:-6px;border:2px solid var(--surface)}.avs .av:first-child{margin-left:0}
.empty{text-align:center;padding:28px 16px;color:var(--ink-2)}
.empty svg{width:56px;height:56px;color:var(--ink-3);margin-bottom:6px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;min-width:0;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-family:var(--f-disp);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cat-dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--tide-soft);color:var(--tide-deep)}
.cat-dot svg{width:20px;height:20px}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.tide{background:var(--tide-soft);color:var(--tide-deep)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.foot{color:var(--ink-3);font-size:12px;text-align:center;margin-top:28px}

/* ---------- hero del día (la marea sube con el viaje) ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;background:var(--hero);color:#fff;padding:20px 18px 18px;min-height:170px}
.hero::before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--sol) 0 45%,transparent 46%);right:-34px;top:-40px;opacity:.9}
.hero.con-foto::before{display:none}
.hero h1{font-size:30px;line-height:1.05;font-weight:800}
.hero .sub{opacity:.85;font-size:14px;margin-top:4px}
.hero .big{font-family:var(--f-disp);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em}
.hero .wave{position:absolute;left:0;right:0;bottom:0;height:var(--lvl,18%);transition:height .8s ease}
.hero .wave svg{position:absolute;left:0;top:-14px;width:200%;height:16px;animation:drift 9s linear infinite}
.hero .wave .fill{position:absolute;inset:0;background:#1FB0E0;opacity:.6}
.hero .in-hero{position:relative;z-index:1}
@keyframes drift{to{transform:translateX(-50%)}}
.saldo{display:flex;align-items:center;justify-content:space-between;gap:12px}
.saldo .amt{font-size:26px}
.pos{color:var(--ok)} .neg{color:var(--bad)}

/* ---------- balances ---------- */
.bal{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.bal:last-child{border-bottom:0}
.bar{height:6px;border-radius:3px;background:var(--surface-2);position:relative;margin-top:6px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.bar i.p{left:50%;background:var(--ok)} .bar i.n{right:50%;background:var(--bad)}
.tx{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tx:last-child{border-bottom:0}

/* ---------- tareas ---------- */
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;align-items:start}
.col h3{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tcard{background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);border:0;width:100%;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.tcard .t{font-weight:700}
.tcard.done .t{text-decoration:line-through;color:var(--ink-3)}
.prog{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}.prog i{display:block;height:100%;background:var(--tide)}
.sub-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sub-item input{width:22px;height:22px;accent-color:var(--tide)}

/* ---------- eventos ---------- */
.day{margin-top:18px}
.day-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.day-h b{font-family:var(--f-disp);font-size:20px}
.ev{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);border:0;width:100%;text-align:left;cursor:pointer}
.ev .blk{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding-top:3px}
.ev.noche{background:linear-gradient(135deg,var(--surface) 55%,var(--sun-soft))}
.ev .t{font-family:var(--f-disp);font-weight:700;font-size:17px;line-height:1.2}
.prop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.vote{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:56px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-weight:800;color:var(--ink-2)}
.vote svg{width:20px;height:20px}
.vote[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}

/* ---------- nosotros ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);border:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--sun);background:var(--sun-soft);border-radius:999px;padding:2px 8px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:15px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}

/* ---------- hoja inferior ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--scrim)}
.sheet-card{position:relative;width:100%;max-width:680px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sheet-h h2{flex:1;font-size:22px}
.x{border:0;background:var(--surface-2);width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.x svg{width:20px;height:20px}
.add-opt{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:0;border-radius:14px;padding:12px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.add-opt .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tide-soft);color:var(--tide-deep)}
.add-opt .ic.s{background:var(--sun-soft);color:var(--sun)}
.add-opt .ic svg{width:22px;height:22px}
.add-opt b{display:block}
.thumb{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:var(--surface-2)}
.pin-big{font-family:var(--f-disp);font-weight:800;font-size:56px;letter-spacing:.2em;text-align:center;color:var(--tide)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.table-x{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}

/* ---------- carta de comida ---------- */
.carta{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.carta-t{font-size:22px;margin-top:2px;line-height:1.15}
.plato{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border:0;border-bottom:1px dashed var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:inherit}
.plato:last-of-type{border-bottom:0}
.plato-n{font-family:var(--f-disp);font-weight:700;font-size:17px;line-height:1.2}
.plato-d{font-size:14px;color:var(--ink-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pv{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;overflow:hidden;flex:none}
.pv svg{width:28px;height:28px}.pv img{width:100%;height:100%;object-fit:cover}
.pv.sm{width:40px;height:40px;border-radius:10px}.pv.sm svg{width:20px;height:20px}
.pv.lg{width:100%;height:200px;border-radius:18px}.pv.lg svg{width:56px;height:56px}
.meal{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;border:1px dashed var(--line);background:none;border-radius:14px;padding:8px 12px;width:100%;text-align:left;cursor:pointer;color:inherit}
.pbar{height:10px;border-radius:5px;background:var(--surface-2);position:relative;overflow:hidden;margin-top:8px}
.pbar .band{position:absolute;top:0;bottom:0;background:var(--tide-soft)}
.pbar .fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px;background:var(--tide)}.pbar .fill.over{background:var(--bad)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.foto{border:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;text-align:left;display:flex;flex-direction:column;color:inherit}
.foto img,.foto .pv{width:100%;height:150px;object-fit:cover;border-radius:0}
.foto .cap{padding:8px 10px;font-size:13px;color:var(--ink-2)}
.swatch{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);flex:none}
.insp{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:12px}
.insp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.insp-add{aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-2);font-size:12px;text-align:center;cursor:pointer;padding:6px}
.insp-add svg{width:22px;height:22px}
.seg.sm4 button{font-size:13px;padding:0 4px}

/* ---------- itinerario tipo app de crucero ---------- */
.ahora{margin-top:14px;background:linear-gradient(135deg,var(--surface) 40%,var(--tide-soft))}
.ah-t{font-family:var(--f-disp);font-weight:800;font-size:19px;line-height:1.2;margin-top:2px}
.day-tema{display:flex;align-items:center;gap:4px;margin:-2px 0 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.day-tema i{width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}.day-tema span{margin-left:6px}
.tl{position:relative;padding-left:14px}.tl::before{content:"";position:absolute;left:3px;top:8px;bottom:8px;width:2px;border-radius:1px;background:var(--line)}
.tl>*{position:relative}.tl>*::before{content:"";position:absolute;left:-15px;top:18px;width:8px;height:8px;border-radius:50%;background:var(--tide);box-shadow:0 0 0 3px var(--bg)}
/* ---------- álbum ---------- */

let IA={ok:false,motor:null,probada:false};
const IA_URL=/^https?:$/.test(location.protocol)&&!/claude\.ai|claudeusercontent/.test(location.hostname)?'/api/ia':null;
async function probarIA(){if(!IA_URL){IA.probada=true;return IA}try{const r=await fetch(IA_URL+'/salud',{cache:'no-store'});const j=await r.json();IA={ok:!!j.ok,motor:j.motor||null,probada:true}}catch(e){IA={ok:false,motor:null,probada:true}}return IA}
function contextoIA(){return{looks:Object.keys(ESTILOS),autor_id:ME.id,autor:nom(ME.id),hoy:hoyISO(),moneda:CFG.moneda||'USD',personas:activos().map(p=>({id:p.id,nombre:p.nombre,apodo:p.apodo||''})),eventos:EVENTOS.filter(e=>e.estado!=='cancelado').map(e=>({id:e.id,titulo:e.titulo,dia:e.dia||null}))}}
async function leerIA({texto,dataUrl,modo,plan,items}){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),70000);
  let auth={};if(MODO==='supabase'){try{const{data}=await Sb.c.auth.getSession();if(data&&data.session)auth={authorization:'Bearer '+data.session.access_token}}catch(e){}}
  try{const r=await fetch(IA_URL,{method:'POST',headers:{'content-type':'application/json',...auth},body:JSON.stringify({texto:texto||'',imagen:dataUrl||null,modo:modo||'auto',contexto:{...contextoIA(),plan_actual:plan||null,items_actuales:items&&items.length?items.map(i=>({descripcion:i.descripcion,total:i.total})):undefined}}),signal:ctl.signal});
    const j=await r.json().catch(()=>({}));if(!r.ok||!j.propuesta)throw new Error(j.error||'La IA no respondió');return j.propuesta}
  catch(e){throw new Error(e.name==='AbortError'?'se demoró demasiado':e.message)}finally{clearTimeout(t)}}
/* primero la IA; si no está o falla, el plan B (lectura rápida o la función de Supabase), diciendo por qué */
async function leerConIA(o,planB){
  if(IA_URL&&!IA.probada)await probarIA();
  if(IA_URL&&IA.ok){try{return await leerIA(o)}catch(e){const p=await planB();p.resumen='La IA no pudo esta vez ('+e.message+'). Te dejo una lectura rápida: revísala.';return p}}
  return planB();
}

function av(id,cls=''){
  const p=PMAP[id]; const n=p?(p.apodo||p.nombre||'?'):'?';
  let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; const [bg,fg]=AVC[h%AVC.length];

/* ============================================================================

   ============================================================================ */
function partesDe(g){
  const ps=(g.reparto&&g.reparto.partes)||[]; const n=ps.length; if(!n) return [];
  const modo=g.reparto.modo, m=+g.monto||0;
  if(modo==='igual'){const base=Math.floor(m*100/n)/100; const resto=r2(m-base*n); return ps.map((p,i)=>({id:p.persona_id,v:i===0?r2(base+resto):base}))}
  if(modo==='porcentaje') return ps.map(p=>({id:p.persona_id,v:r2(m*(+p.valor||0)/100)}));
  return ps.map(p=>({id:p.persona_id,v:r2(+p.valor||0)}));
}
function miParte(g){const x=partesDe(g).find(p=>p.id===ME.id);return x?x.v:0}
/* lo que este gasto me deja: + me deben (presté), − debo. Igual que la columna derecha de Splitwise */
function miNeto(g){if(g.eliminado||g.fondo)return 0;const pague=(g.pagadores||[]).filter(x=>x.persona_id===ME.id).reduce((a,x)=>a+(+x.monto||0),0);return r2(pague-miParte(g))}
function balances(){
  const B={}; activos().forEach(p=>B[p.id]={id:p.id,pagado:0,toca:0});
  for(const g of GASTOS){ if(g.eliminado||g.fondo) continue;
    for(const x of (g.pagadores||[])){ if(!B[x.persona_id]) B[x.persona_id]={id:x.persona_id,pagado:0,toca:0}; B[x.persona_id].pagado=r2(B[x.persona_id].pagado+(+x.monto||0)) }
    for(const x of partesDe(g)){ if(!B[x.id]) B[x.id]={id:x.id,pagado:0,toca:0}; B[x.id].toca=r2(B[x.id].toca+x.v) }
  }
  return Object.values(B).map(b=>({...b,saldo:r2(b.pagado-b.toca)}));
}
function simplificar(bs){
  const deb=bs.filter(b=>b.saldo<-0.009).map(b=>({id:b.id,s:-b.saldo})).sort((a,b)=>b.s-a.s);
  const acr=bs.filter(b=>b.saldo>0.009).map(b=>({id:b.id,s:b.saldo})).sort((a,b)=>b.s-a.s);
  const out=[]; let i=0,j=0;
  while(i<deb.length&&j<acr.length){const m=Math.min(deb[i].s,acr[j].s); if(m>0.009) out.push({de:deb[i].id,a:acr[j].id,monto:r2(m)}); deb[i].s-=m; acr[j].s-=m; if(deb[i].s<0.009)i++; if(acr[j].s<0.009)j++}
  return out;
}
function fondo(){
  let ap=0,ga=0; for(const g of GASTOS){ if(g.eliminado) continue; if(g.tipo==='aporte') ap+=+g.monto; if(g.fondo) ga+=+g.monto }
  return {aportado:r2(ap),gastado:r2(ga),disponible:r2(ap-ga)};
}

function normTel(t){let d=String(t??'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.length===10&&d.startsWith('0'))d='593'+d.slice(1);else if(d.length===9&&d.startsWith('9'))d='593'+d;else if(d.length===10&&d.startsWith('3'))d='57'+d;return /^[0-9]{11,15}$/.test(d)?d:null}
function normCumple(c){const t=String(c??'').trim();let dd,mm,m;if(m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)){mm=+m[2];dd=+m[3]}else if(m=t.match(/^(\d{1,2})[\/\-. ](\d{1,2})/)){dd=+m[1];mm=+m[2]}else if(m=t.match(/^(\d{2})(\d{2})$/)){dd=+m[1];mm=+m[2]}else return null;
  const max=[31,29,31,30,31,30,31,31,30,31,30,31][mm-1];if(!max||dd<1||dd>max)return null;return String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0')}

/* ---------- lectura rápida sin IA (respaldo del modo demo y si la IA falla) ---------- */
function buscarPersonas(txt){
  const t=norm(txt); if(!t) return {ids:[],dudas:[]};
  const ids=[],dudas=[];
  for(const trozo of t.split(/,| y | e /).map(s=>s.trim()).filter(Boolean)){
    const c=activos().filter(p=>{const n=norm(p.nombre),a=norm(p.apodo||'').replace(/[^a-z ]/g,'').trim();return n===trozo||a===trozo||n.split(' ')[0]===trozo||(a&&a.split(' ')[0]===trozo)||n.startsWith(trozo+' ')});
    if(c.length===1) ids.push(c[0].id); else if(c.length>1) dudas.push(`"${trozo}" puede ser ${c.map(p=>p.nombre).join(', ')}: elige a mano`);
    else if(/^nati/.test(trozo)) dudas.push(`"${trozo}" puede ser cualquiera de las Natalias: elige a mano`);
  }
  return {ids,dudas};
}
/* «pon esta foto de portada del círculo de intenciones» → ¿de qué plan habla? */
function planDePortada(texto,conFoto){const n=norm(texto);if(!/portada|foto (del|de la|para el|para la|de) (evento|plan|noche|actividad)|cambia(r)? (la )?foto/.test(n))return null;
  const ev=EVENTOS.find(e=>e.id===eventoDe(texto));if(ev)return ev;
  const pal=n.split(/[^a-z0-9]+/).filter(w=>w.length>3&&!/portada|evento|foto|plan|noche|poner|cambiar|esta|este/.test(w));
  const best=EVENTOS.filter(e=>e.estado!=='cancelado').map(e=>({e,p:pal.filter(w=>norm(e.titulo+' '+(e.tematica||'')).includes(w)).length})).sort((a,b)=>b.p-a.p)[0];
  return best&&best.p>0?best.e:(conFoto?{id:'',titulo:''}:null)}
/* «del 9 al 12 de octubre» → {desde, hasta} */
function fechasDe(texto){const n=norm(texto),re=/(\d{1,2})\s*(?:de\s+)?(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)?/g;let m,L=[];
  while((m=re.exec(n)))L.push({d:+m[1],mes:m[2]==='setiembre'?'septiembre':m[2]});
  L=L.filter(x=>x.d>=1&&x.d<=31);if(L.length<2||!L.some(x=>x.mes))return null;
  const a=L[0],b=L[1],mb=b.mes||a.mes,ma=a.mes||mb,anio=+(CFG.desde||hoyISO()).slice(0,4);
  const f=(d,mes)=>anio+'-'+String(MESES_L.indexOf(mes)+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  const desde=f(a.d,ma);let hasta=f(b.d,mb);if(hasta<desde)hasta=(anio+1)+hasta.slice(4);return{desde,hasta}}
function leerLocal(texto,conFoto,modo){
  const t=String(texto||'').trim(), prop={gastos:[],tareas:[],eventos:[],resumen:'',local:true};
  const portada=planDePortada(t,conFoto);if(portada){prop.portada={evento_id:portada.id};prop.resumen='Foto de portada para «'+portada.titulo+'».';return prop}
  const fechas=fechasDe(t);if(fechas&&/viaje|fecha|salimos|llegamos|del \d|vamos/.test(norm(t))){prop.viaje=fechas;prop.resumen='Fechas del viaje.';return prop}
  if(modo==='auto'&&!/\d/.test(t)&&/propong|hagamos|plan |noche de|tarde de|actividad/.test(norm(t)))modo='plan';
  if(modo==='plan'){const n=norm(t);
    prop.eventos.push({titulo:(t.split(/[,.;\n]/)[0]||'Plan nuevo').slice(0,60).replace(/^./,c=>c.toUpperCase()),tematica:null,descripcion:t,
      bloque:/manana|desayuno|amanecer|temprano/.test(n)?'manana':/atardecer|sunset/.test(n)?'atardecer':/tarde/.test(n)?'tarde':'noche',
      lugar:LUGARES_PLAN.find(l=>n.includes(l))||null,dress_code:Object.keys(ESTILOS).find(k=>n.includes(norm(k)))||null,lista:[],menu:[]});
    prop.resumen='Lectura rápida (sin IA): revisa y toca lo que quieras cambiar.';return prop}

function leerMonto(s){const pt=s.lastIndexOf('.'),cm=s.lastIndexOf(',');
  if(pt>=0&&cm>=0){const dec=pt>cm?'.':',';s=s.split(dec==='.'?',':'.').join('');s=s.replace(dec,'.')}
  else{const sep=pt>=0?'.':cm>=0?',':'';if(sep){const partes=s.split(sep);s=(partes.length>2||partes[partes.length-1].length===3)?partes.join(''):partes.join('.')}}
  return r2(parseFloat(s)||0)}
const VERBOS='llevar|comprar|traer|armar|hacer|conseguir|reservar|limpiar|preparar|cocinar|organizar|pagar|alquilar|cargar|pedir|confirmar|buscar|lavar|contratar|imprimir';
/* "Comprar 3 fundas de hielo, carbón para el asado y llevar los micrófonos" → 3 tareas; la segunda hereda el verbo */
function partirTareas(t){
  const re=new RegExp('[;,]|\\s+y\\s+(?=(?:'+VERBOS+')\\b)','i'), rv=new RegExp('^('+VERBOS+')\\b','i');
  let items=t.includes('\n')?t.split('\n'):t.split(re);
  items=items.map(s=>(s||'').replace(/^\s*(?:[-–•*]|\d+[.)])\s*/,'').trim()).filter(s=>s.length>1);
  let verbo='';
  return items.map(s=>{const m=s.match(rv);if(m)verbo=m[1];else if(verbo&&!/^[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+\s+(?:prende|lleva|compra|trae|hace|arma|cocina|maneja|organiza)/.test(s))s=verbo.toLowerCase()+' '+s;return s.charAt(0).toUpperCase()+s.slice(1)});
}
const EV_CLAVES=[[/karaoke|microfono|proyector/,/karaoke/],[/asado|parrill|grill|carbon|taco|bbq|coctel|cocktail|mojito|margarita/,/bbq|grill|parrill|asado|taco/],[/restaurante|restaurant|despedida|ultima noche/,/restaurant/],[/pizza|risk|monopol|juegos de mesa/,/pizza|juegos/],[/tapas|vino|hipnosis|tempranillo|rioja/,/tapas/],[/talento|talent/,/talent/],[/yoga/,/yoga/],[/gafas|sesion de fotos|freaky/,/fotos/],[/panzazo|piscina/,/panzazo/],[/intenciones|fogata/,/intenciones/]];
function eventoDe(txt){const t=norm(txt);for(const[q,e]of EV_CLAVES)if(q.test(t)){const ev=EVENTOS.find(x=>x.estado!=='cancelado'&&e.test(norm(x.titulo+' '+(x.tematica||''))));if(ev)return ev.id}return null}
function categoriaDe(t){t=norm(t);
  if(/cocinera|sueldo/.test(t))return'cocinera';
  if(/hielo|cerveza|ron|trago|vino|whisky|aguardiente|michelada|bebida|cola|agua/.test(t))return'bebidas';
  if(/mercado|super|tienda|despensa|frutas|verdura|viveres/.test(t))return'despensa';
  if(/gasolina|taxi|uber|bus|peaje|parqueadero|vuelo|pasaje|carro/.test(t))return'transporte';
  if(/casa|hotel|airbnb|hospedaje|cabana|arriendo/.test(t))return'hospedaje';
  if(/lancha|tour|entrada|surf|snorkel|kayak|clase/.test(t))return'actividades';
  if(/parlante|microfono|proyector|carbon|gas|cooler|toldo|equipo/.test(t))return'logistica';
  if(/comida|almuerzo|cena|desayuno|taco|pizza|pescado|camaron|carne|asado|restaurante/.test(t))return'restaurantes';
  return'otros'}
function grupoDe(t){t=norm(t);
  if(/compra|comprar|mercado|super/.test(t))return'Compras';
  if(/cerveza|hielo|trago|ron|bebida/.test(t))return'Bebidas';

/* ── versión: la app sabe cuál tiene y pregunta cuál está publicada; «Actualizar» limpia el caché y recarga ── */
let VER_NUEVA='',VER_T=0;
async function revisarVersion(){if(!/fieldbuil\.ai$|workers\.dev$/.test(location.hostname)||Date.now()-VER_T<60000)return;VER_T=Date.now();
  try{const r=await fetch('/api/version?x='+Date.now(),{cache:'no-store'});const j=await r.json();const n=j&&j.v;const vNum=v=>+String(v||'').replace(/\D/g,'')||0;
    const nueva=n&&vNum(n)>vNum(BUILD_TAG)?n:'';if(nueva!==VER_NUEVA){VER_NUEVA=nueva;if(ME&&$('#sheet').hidden)render()}}catch(e){}}
async function actualizarApp(){toast('Actualizando…');
  try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister()}}catch(e){}
  try{const ks=await caches.keys();for(const k of ks)await caches.delete(k)}catch(e){}
  const u=new URL(location.href);u.searchParams.set('v',String(Date.now()));u.hash=location.hash||'#hoy';location.replace(u.toString())}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')revisarVersion()});

const pushOk=()=>MODO==='supabase'&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&/fieldbuil\.ai$|workers\.dev$/.test(location.hostname);

  if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!yaInstalada())return '';   // en iPhone solo avisa la app instalada
  return `<div class="card subir-f" style="cursor:default"><span class="subir-ic bell-ic">${ic('bell')}</span><span class="grow"><b>Recibir avisos</b><span class="muted tiny">Gastos nuevos, planes y el chat, como un mensaje</span></span><button class="btn sm primary" onclick="activarAvisos(this)">Activar</button><button class="x" aria-label="Ahora no" onclick="lsSet('marea_no_avisos','1');render()">${ic('x')}</button></div>`}
async function activarAvisos(b){if(b){b.disabled=true;b.textContent='Un momento…'}
  try{const perm=await Notification.requestPermission();if(perm!=='granted'){toast('No se activaron los avisos');render();return}
    await sincronizarPush(true);toast('Avisos activados');render()}catch(e){toast('No pude activar los avisos: '+e.message);render()}}
async function sincronizarPush(forzar){if(!pushOk()||Notification.permission!=='granted')return;if(!forzar&&sessionStorage.getItem('marea_push_ok'))return;
  const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
  if(!sub){const{publica}=await API.fn('marea-avisar',{action:'vapid'});const raw=Uint8Array.from(atob(publica.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:raw})}
  const j=sub.toJSON();await API.fn('marea-avisar',{action:'guardar',endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,ua:navigator.userAgent.slice(0,200)});
  try{sessionStorage.setItem('marea_push_ok','1')}catch(e){}}

  const n=miNeto(g), part=(g.pagadores||[]).some(x=>x.persona_id===ME.id)||partesDe(g).some(x=>x.id===ME.id);

function validarF(){
  const m=r2(parseFloat(String(F.monto).replace(',','.'))||0);

  if(F.modo==='porcentaje'){const s=r2(F.part.reduce((a,id)=>a+(+F.valores[id]||0),0));if(Math.abs(s-100)>0.01)return `Los porcentajes suman ${s}%, deben sumar 100%`}
  if(F.modo==='monto'){const s=r2(F.part.reduce((a,id)=>a+(+F.valores[id]||0),0));if(Math.abs(s-m)>0.01)return `Las partes suman ${money(s)}, deben sumar ${money(m)}`}
  return '';

function achicar(file,lado,q){return new Promise((ok,mal)=>{const r=new FileReader();r.onerror=()=>mal(new Error('No pude leer la foto'));r.onload=()=>{const im=new Image();im.onerror=()=>mal(new Error('Ese archivo no es una imagen'));im.onload=()=>{const k=Math.min(1,lado/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const dataUrl=c.toDataURL('image/jpeg',q);c.toBlob(blob=>ok({blob,dataUrl}),'image/jpeg',q)};im.src=r.result};r.readAsDataURL(file)})}

function estadoAuto(t){if(t.estado==='listo')return'listo';const st=t.subtareas||[];if(st.length&&st.every(x=>x.ok))return'listo';return t.responsable?'en_curso':'por_hacer'}
/* a quién le toca: por especialidad (el superpoder de su ficha) y, entre ellos, quien tenga menos tareas abiertas */
const ESPECIAL=[[/cocin|comida|desayuno|almuerzo|cena|parrilla|asado|mercado|compra/, ['Cocino','Organizo']],[/maneja|carro|transporte|recoger|hielo|traer/, ['Manejo','Madrugo']],
  [/parlante|microfono|proyector|audio|playlist|karaoke|musica/, ['Llevo el parlante','Hago playlists']],[/foto|video|tripode|gafas/, ['Tomo las fotos']],[/juego|torneo|fiesta|show|decor/, ['Animo la fiesta','Hago playlists']],[/casa|limpiar|lavar|turno|basura|cuarto/, ['Organizo','Madrugo']]];
function abiertasDe(pid){return TAREAS.filter(t=>t.responsable===pid&&estadoAuto(t)!=='listo').length}
function sugerido(t){const txt=norm(t.titulo+' '+(t.grupo||'')+' '+(t.detalle||''));let sp=[];for(const[re,l]of ESPECIAL)if(re.test(txt))sp.push(...l);
  const con=activos().filter(p=>sp.includes((p.perfil||{}).superpoder));const pool=con.length?con:activos();
  const q=pool.slice().sort((a,b)=>abiertasDe(a.id)-abiertasDe(b.id))[0];return q?{id:q.id,por:con.length?q.perfil.superpoder:'tiene menos tareas'}:null}

    <button class="grow tbody" onclick="abrirTarea('${t.id}')"><div class="t">${esc(t.titulo)}</div>
      <div class="row wrap-ok" style="gap:4px;margin-top:4px">${t.prioridad==='alta'&&e!=='listo'?'<span class="pill bad">Urgente</span>':''}<span class="pill mar">${esc(t.grupo||'—')}</span>${t.fecha?`<span class="pill">${fechaCorta(t.fecha)}</span>`:''}${ev?`<span class="pill sun">${esc(ev.titulo)}</span>`:''}${st.length?`<span class="pill">${ok}/${st.length}</span>`:''}</div></button>
    ${t.responsable?av(t.responsable,'xs'):sg?`<button class="btn sm sun" title="Por especialidad: ${esc(sg.por)}" onclick="asignar('${t.id}','${sg.id}')">${esc(nom(sg.id))}</button>`:''}</div>`}

  if(ev){for(const k of ['titulo','tematica','descripcion','bloque','lugar','dress_code'])if(ev[k])n[k]=ev[k];

function detectarAlergenos(txt){
  let t=norm(txt); const s=new Set();
  if(/mariscos? oscuros?/.test(t)){s.add('oscuros');t=t.replace(/mariscos? oscuros?/g,' ')}
  if(/concha|mejillon|almeja|ostion|ostra/.test(t)){s.add('conchas');s.add('oscuros')}
  if(/camaron|langost|pulpo|calamar|marisc|cangrejo|jaiba|marinero|percebe/.test(t))s.add('mariscos');
  if(/pescado|corvina|dorado|atun|tilapia|picudo|robalo|bacalao|encocado de pescado/.test(t))s.add('pescado');
  if(/chicharron|cerdo|chancho|tocino|jamon|chorizo|bondiola|salchich|embutido/.test(t)){s.add('cerdo');s.add('carne')}
  if(/pollo|\bres\b|carne|lomo|costilla|parrillada|hamburgues/.test(t))s.add('carne');
  if(/queso|leche(?! de coco)|yogur|mantequilla|crema|manjar|mozzarella|helado/.test(t))s.add('lacteos');
  if(/harina|\bpan\b|pizza|pancake|panqueque|trigo|tostada|toast|pasta|galleta|masa|avena|apanado|empanizado/.test(t))s.add('gluten');
  if(/huevo|tortilla espanola|mayonesa/.test(t))s.add('huevo');
  if(/\bmani\b|cacahuate/.test(t))s.add('mani');
  const sinAlc=/sin alcohol|alcohol free|free alcohol|cero alcohol|zero alcohol|0[.,]0|cerveza cero|mocktail/.test(t.replace(/-/g,' '));
  if(!sinAlc&&/cerveza|vino|\bron\b|tequila|margarita|sangria|whisky|aguardiente|licor|michelada|coctel|cocktail|shot|maridaje/.test(t))s.add('alcohol');
  return [...s];
}

const PASILLOS=[['Del mar',/camaron|pescado|concha|mejillon|calamar|pulpo|marisc|corvina|dorado|atun/],['Carnes',/pollo|\bres\b|carne|lomo|costilla|chorizo|chicharron|cerdo|jamon|embutido|tocino/],
  ['Lácteos y huevos',/queso|leche(?! de coco)|yogur|mantequilla|crema|huevo|mozzarella|manjar/],['Frutas y verduras',/papaya|sandia|banano|verde|maduro|platano|aguacate|limon|tomate|cebolla|pimiento|cilantro|culantro|naranj|fruta|frutos|\bcol\b|lechuga|choclo|mango|maracuya|uva|\bajo\b|\baji\b|ensalada|papas|romero|patacon|coco/],
  ['Bebidas',/cafe|vino|cerveza|jugo|agua|hielo|\bron\b|tequila|gaseosa|soda/],['Despensa',/./]];
function listaCompras(sel){
  const M=new Map(); const add=(txt,plato,veces=1)=>{const k=norm(txt).replace(/es$|s$/,'');if(!k)return;const o=M.get(k)||{txt,platos:new Set(),veces:0};o.veces+=veces;o.platos.add(plato);M.set(k,o)};

  estaciones().forEach(p=>(p.ingredientes||[]).forEach(i=>add(i,p.nombre,sel.length)));
  const grupos=PASILLOS.map(([n])=>({n,items:[]}));
  [...M.values()].sort((a,b)=>a.txt.localeCompare(b.txt)).forEach(o=>{const i=PASILLOS.findIndex(([,re])=>re.test(norm(o.txt)));grupos[i].items.push(o)});
  return grupos.filter(g=>g.items.length);
}

function infoLocal(t){const r={local:true,que_llevar:[],reglas:[],contactos:[],faq:[]},n=norm(t);
  const w=t.match(/wi-?fi[ \t]*(?:red|es|se llama|nombre)?[ \t]*[: \t][ \t]*([^\s,;:]+)/i);if(w&&!/^(clave|contrase)/i.test(w[1]))r.wifi_red=w[1];
  const c=t.match(/(?:clave|contrase[ñn]a|password)[ \t]*(?:del wifi|wifi)?[: \t]+([^\s,;]+)/i);if(c)r.wifi_clave=c[1].replace(/[.,;:]+$/,'');
  const ci=t.match(/check.?in[^\d]*(\d{1,2}(?::\d{2})?\s*(?:am|pm|h)?)/i);if(ci)r.checkin=ci[1].trim();
  const co=t.match(/(?:check.?out|salida)[^\d]*(\d{1,2}(?::\d{2})?\s*(?:am|pm|h)?)/i);if(co)r.checkout=co[1].trim();
  const d=t.match(/(?:direcci[oó]n|queda en|ubicad[ao] en)[:\s]+([^\n.]+)/i);if(d)r.direccion=d[1].trim();
  const u=t.match(/https:\/\/[^\s]*(?:maps|goo\.gl)[^\s]*/i);if(u)r.mapa_url=u[0];
  const ll=t.match(/(?:llevar|traer)[:\s]+([^\n.]+)/i);if(ll)r.que_llevar=ll[1].split(/,|\sy\s/).map(x=>x.trim()).filter(Boolean).map(x=>x.charAt(0).toUpperCase()+x.slice(1));
  const AM=[['piscina','Piscina'],['frente al mar|frente a la playa|acceso a la playa|vista al mar','Frente al mar'],['wifi','WiFi'],['cocina','Cocina equipada'],['parrilla|bbq|barbacoa','Parrilla'],['aire acondicionado','Aire acondicionado'],['estacionamiento|parqueadero','Estacionamiento'],['lavadora','Lavadora'],['jacuzzi|tina','Jacuzzi'],['tv|televis','TV'],['hamaca','Hamacas'],['terraza','Terraza']];
  AM.forEach(([re,l])=>{if(new RegExp(re).test(n))(r.amenidades=r.amenidades||[]).push(l)});
  const air=t.match(/https:\/\/(?:www\.)?airbnb\.[a-z.]+\/rooms\/\d+/i);if(air)r.airbnb_url=air[0];
  t.split('\n').forEach(l=>{if(/^\s*(no |prohibido|cada quien|favor |por favor|respetar)/i.test(l))r.reglas.push(l.trim());const tel=l.match(/\+?\d[\d\s-]{7,}\d/);if(tel){const nm=l.replace(tel[0],'').replace(/[:\-–·]+\s*$/,'').trim();if(nm)r.contactos.push({nombre:nm.slice(0,40),rol:'',tel:tel[0].trim()})}});
  return r}

/* ============================================================================
   CAUSAR UN GASTO (la lógica de AERO, sin lo contable):
   la factura se lee, se valida que cuadre, se revisan duplicados, se propone
   categoría y etiquetas por el historial del comercio, y se reparte.
   ============================================================================ */
const claveComercio=f=>{if(!f)return'';const r=String(f.ruc||'').replace(/\D/g,'');return r.length>=10?'ruc:'+r:(f.comercio?'n:'+norm(f.comercio).replace(/[^a-z0-9 ]/g,'').trim():'')};
const comercioDe=f=>{const k=claveComercio(f);return k?COMERCIOS.find(c=>c.clave===k):null};
/* ¿cuadra? subtotal + IVA = total (±0,05), IVA = 15 % de lo gravado, total = monto escrito */
function cuadra(f,monto){
  if(!f||f.total==null)return null; const pr=[], t=+f.total;
  if(f.subtotal!=null&&f.impuestos!=null){const s=r2((+f.subtotal)+(+f.impuestos)+(+f.propina||0));if(Math.abs(s-t)>0.05)pr.push(`Subtotal + IVA${f.propina?' + propina':''} da ${money(s)}, no ${money(t)}`)}
  if(f.subtotal!=null&&f.impuestos!=null&&+f.impuestos>0){const iva=r2((+f.subtotal)*0.15);if(Math.abs(iva-(+f.impuestos))>Math.max(0.05,(+f.subtotal)*0.005)&&(+f.subtotal_0||0)===0)pr.push(`El IVA (${money(f.impuestos)}) no es el 15 % de ${money(f.subtotal)}`)}
  if(monto&&Math.abs(t-monto)>0.01)pr.push(`El total de la factura es ${money(t)} y el monto escrito es ${money(monto)}`);
  return {ok:!pr.length,pr};
}
/* duplicado: mismo número de factura del mismo RUC, o mismo comercio + fecha + monto */
function duplicadoDe(g){
  const f=g.factura||{}, num=String(f.numero||'').replace(/\D/g,''), k=claveComercio(f);
  return GASTOS.find(x=>x.id!==g.id&&!x.eliminado&&x.tipo==='gasto'&&(()=>{const xf=x.factura||{};
    if(num&&xf.numero&&String(xf.numero).replace(/\D/g,'')===num&&claveComercio(xf)===k)return true;
    return k&&claveComercio(xf)===k&&x.fecha===g.fecha&&Math.round(+x.monto*100)===Math.round(+g.monto*100)})())||null;
}
/* etiquetas automáticas: categoría + noche del gasto + las que sugiera la IA (máx. 3) */
const ETQ_CAT={despensa:'despensa',bebidas:'bar',hospedaje:'casa',cocinera:'cocinera',logistica:'equipo',transporte:'transporte',restaurantes:'afuera',actividades:'actividades'};
function etiquetasAuto(F){
  const n=new Set(), ev=EVENTOS.find(e=>e.id===F.evento_id);
  if(ETQ_CAT[F.categoria])n.add(ETQ_CAT[F.categoria]);
  if(ev){const t=norm(ev.titulo+' '+(ev.tematica||''));[['karaoke','karaoke'],['grill|parrill|taco','parrillada'],['pizza|juegos','juegos'],['tapas|vino','tapas'],['intenciones|bienvenida','bienvenida'],['fotos','fotos'],['yoga|panzazo|playa','playa']].forEach(([re,l])=>{if(new RegExp(re).test(t))n.add(l)})}
  (F.etq_ia||[]).forEach(x=>n.add(norm(x).replace(/^#/,'').slice(0,20)));
  return [...n].filter(Boolean).slice(0,3);
}
async function idsEtiquetas(nombres){const out=[];for(const nm of nombres){let t=ETIQUETAS.find(x=>norm(x.nombre)===nm);if(!t){try{t=await API.nuevaEtiqueta(nm);ETIQUETAS.push(t)}catch(e){continue}}out.push(t.id)}return out}
/* presupuesto: ¿este gasto pasa el máximo de su rubro? */
function excedePresupuesto(F,monto){const r=PRESU.find(x=>catIgual(F.categoria,x.categoria)&&x.maximo);if(!r)return null;
  const real=GASTOS.filter(g=>g.tipo==='gasto'&&g.id!==F.id&&catIgual(g.categoria,r.categoria)).reduce((a,g)=>a+ +g.monto,0);
  return real+monto>+r.maximo?{rubro:r.nombre,max:+r.maximo,queda:r2(+r.maximo-real)}:null}
/* lo que la app ya sabe del comercio, aplicado a un formulario nuevo */
function aplicarHistorial(F){const c=comercioDe(F.factura);if(!c)return F;
  F.historial=`${c.nombre}: ${c.veces} factura${c.veces===1?'':'s'} antes, como ${CATN[c.categoria]||c.categoria}${c.alcance?(c.alcance==='fijo'?', para todo el grupo':', consumo de algunos'):''}.`;
  if(c.categoria&&CATN[c.categoria])F.categoria=c.categoria;
  if(c.alcance==='fijo'){F.alcance='fijo';F.part=activos().map(p=>p.id);F.modo='igual'}
  if((c.etiquetas||[]).length)F.etq_ia=[...new Set([...(F.etq_ia||[]),...c.etiquetas])];
  return F}
/* SRI · clave de acceso de 49 dígitos: fecha, tipo, RUC, serie y secuencial */
function leerClaveAcceso(t){const m=String(t||'').replace(/\s/g,'').match(/\d{49}/);if(!m)return null;const k=m[0];
  const tipo={'01':'factura','03':'liquidación','04':'nota de crédito','05':'nota de débito','07':'retención'}[k.slice(8,10)]||'otro';
  return {clave_acceso:k,fecha:`${k.slice(4,8)}-${k.slice(2,4)}-${k.slice(0,2)}`,tipo_sri:tipo,ruc:k.slice(10,23),numero:`${k.slice(24,27)}-${k.slice(27,30)}-${k.slice(30,39)}`}}
/* SRI · XML de la factura electrónica (el que llega al correo) */
function leerXmlSri(txt){
  let d=new DOMParser().parseFromString(txt,'text/xml');
  const cdata=d.querySelector('comprobante');if(cdata&&cdata.textContent.includes('<'))d=new DOMParser().parseFromString(cdata.textContent,'text/xml');
  const q=s=>{const n=d.querySelector(s);return n?n.textContent.trim():''};
  if(!q('ruc')&&!q('importeTotal'))throw new Error('Ese XML no parece una factura del SRI');
  let iva=0;d.querySelectorAll('totalConImpuestos totalImpuesto').forEach(n=>{if((n.querySelector('codigo')||{}).textContent==='2')iva+=+(n.querySelector('valor')||{textContent:0}).textContent});
  const items=[...d.querySelectorAll('detalles detalle')].map(n=>({descripcion:(n.querySelector('descripcion')||{}).textContent||'',cantidad:+((n.querySelector('cantidad')||{}).textContent||0)||null,total:+((n.querySelector('precioTotalSinImpuesto')||{}).textContent||0)||null}));
  const f=q('fechaEmision').split('/');
  return {tipo_documento:'factura',comercio:q('nombreComercial')||q('razonSocial'),ruc:q('ruc'),fecha:f.length===3?`${f[2]}-${f[1]}-${f[0]}`:null,numero:[q('estab'),q('ptoEmi'),q('secuencial')].filter(Boolean).join('-'),clave_acceso:q('claveAcceso')||null,
    items,subtotal:+q('totalSinImpuestos')||null,impuestos:r2(iva),propina:+q('propina')||null,total:+q('importeTotal')||null};
}
async function leerArchivoXml(file){
  try{const f=leerXmlSri(await file.text());const cat=categoriaDe((f.comercio||'')+' '+f.items.map(i=>i.descripcion).join(' '));
    F=aplicarHistorial(nuevoForm({descripcion:('Factura de '+(f.comercio||'comercio')).slice(0,60),monto:f.total||'',fecha:f.fecha||hoyISO(),categoria:cat,factura:f,origen:'foto',dudas:[]}));
    F.historial=(F.historial?F.historial+' ':'')+'Leída del XML del SRI: datos exactos, sin IA.';pintarFormGasto()}
  catch(e){toast(e.message)}
}
async function aprenderComercio(g){const f=g.factura;const k=claveComercio(f);if(!k||g.tipo!=='gasto')return;const c=COMERCIOS.find(x=>x.clave===k);
  const etq=(g.etiquetas||[]).map(id=>(ETIQUETAS.find(t=>t.id===id)||{}).nombre).filter(Boolean);
  try{await API.aprenderComercio({clave:k,nombre:f.comercio||(c&&c.nombre)||'',ruc:f.ruc||null,categoria:g.categoria,alcance:g.alcance||null,etiquetas:etq,veces:((c&&c.veces)||0)+1})}catch(e){}}

boot();
