<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ART-START-->
<title>Marea Alta</title>
<meta name="description" content="El viaje a la playa: gastos compartidos, tareas y noches temáticas.">
<meta name="theme-color" content="#0B7A75">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna de 680px que vive en el celular; pestañas fijas abajo; todo lo que se edita sube en una hoja desde abajo.
   Día = arena mojada y agua turquesa. Noche (tema oscuro) = la playa a las 11 pm: azul profundo, el agua brilla, el coral es la fogata. */
:root{
  --bg:#E9F2F0; --surface:#FFFFFF; --surface-2:#F2F7F6; --ink:#0F2A31; --ink-2:#4A6770; --ink-3:#84A0A6; --line:#D3E3E0;
  --tide:#0B7A75; --tide-ink:#FFFFFF; --tide-soft:#D5EDEA; --tide-deep:#075A56;
  --sun:#E5532B; --sun-ink:#FFFFFF; --sun-soft:#FCE5DC;
  --ok:#1C8549; --ok-soft:#DCF1E4; --warn:#9A6512; --warn-soft:#FAEFD6; --bad:#BF3329; --bad-soft:#F8E0DC;
  --shadow:0 1px 2px rgba(15,42,49,.06),0 10px 28px rgba(15,42,49,.08);
  --scrim:rgba(8,24,30,.45);
  --f-disp:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08111F; --surface:#0F1B2E; --surface-2:#14233A; --ink:#E6EEF7; --ink-2:#A2B4C8; --ink-3:#6C809A; --line:#21324C;
    --tide:#35C2B6; --tide-ink:#04211F; --tide-soft:#0F3638; --tide-deep:#7FE3D9;
    --sun:#FF7A55; --sun-ink:#2A0E05; --sun-soft:#3A1E17;
    --ok:#4CC584; --ok-soft:#10301F; --warn:#E5B256; --warn-soft:#352913; --bad:#FF7C6F; --bad-soft:#3A1714;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#0F1B2E; --surface-2:#14233A; --ink:#E6EEF7; --ink-2:#A2B4C8; --ink-3:#6C809A; --line:#21324C;
  --tide:#35C2B6; --tide-ink:#04211F; --tide-soft:#0F3638; --tide-deep:#7FE3D9;
  --sun:#FF7A55; --sun-ink:#2A0E05; --sun-soft:#3A1E17;
  --ok:#4CC584; --ok-soft:#10301F; --warn:#E5B256; --warn-soft:#352913; --bad:#FF7C6F; --bad-soft:#3A1714;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
a{color:var(--tide)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--tide);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- estructura ---------- */
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-disp);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand small{display:block;color:var(--ink-3);font-size:12px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-btn{border:0;background:none;padding:0;cursor:pointer}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:680px;margin:0 auto;display:flex}
.tab{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-3);font-size:11px;font-weight:600;cursor:pointer;min-height:56px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--tide)}
.fab{position:fixed;right:max(16px,calc(50% - 324px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:31;width:58px;height:58px;border-radius:50%;border:0;background:var(--sun);color:var(--sun-ink);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center}
.fab svg{width:28px;height:28px}

/* ---------- piezas ---------- */
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap-ok{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 0 10px}
.sec-h h2{font-size:19px}
.sec-h .link{border:0;background:none;color:var(--tide);font-weight:600;cursor:pointer;padding:6px 0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.tiny{font-size:13px}
.btn{border:0;border-radius:12px;min-height:46px;padding:0 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--tide);color:var(--tide-ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:none;color:var(--tide);padding:0 8px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.chips.scroll::-webkit-scrollbar{display:none}.chips.scroll .chip{flex:none}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;min-height:36px;padding:0 13px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--tide);border-color:var(--tide);color:var(--tide-ink)}
.chip.sunny[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.tide{background:var(--tide-soft);color:var(--tide-deep)} .pill.sun{background:var(--sun-soft);color:var(--sun)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:38px;font-weight:700;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap;padding:0 12px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;padding:10px 12px;font-size:16px}
textarea.in{min-height:96px;resize:vertical}
.in:focus{outline:2px solid var(--tide);outline-offset:0;border-color:transparent}
.in.flag{border-color:var(--warn);background:var(--warn-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;overflow:hidden;font-family:var(--f-disp)}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:64px;height:64px;font-size:24px}
.av.xs{width:24px;height:24px;font-size:11px}
.avs{display:flex}.avs .av{margin-left:-6px;border:2px solid var(--surface)}.avs .av:first-child{margin-left:0}
.empty{text-align:center;padding:28px 16px;color:var(--ink-2)}
.empty svg{width:56px;height:56px;color:var(--ink-3);margin-bottom:6px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;min-width:0;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-family:var(--f-disp);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cat-dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--tide-soft);color:var(--tide-deep)}
.cat-dot svg{width:20px;height:20px}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.tide{background:var(--tide-soft);color:var(--tide-deep)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.foot{color:var(--ink-3);font-size:12px;text-align:center;margin-top:28px}

/* ---------- hero del día (la marea sube con el viaje) ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;background:var(--tide);color:var(--tide-ink);padding:20px 18px 18px;min-height:150px}
.hero h1{font-size:30px;line-height:1.05;font-weight:800}
.hero .sub{opacity:.85;font-size:14px;margin-top:4px}
.hero .big{font-family:var(--f-disp);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em}
.hero .wave{position:absolute;left:0;right:0;bottom:0;height:var(--lvl,18%);transition:height .8s ease}
.hero .wave svg{position:absolute;left:0;top:-14px;width:200%;height:16px;animation:drift 9s linear infinite}
.hero .wave .fill{position:absolute;inset:0;background:var(--tide-deep);opacity:.35}
.hero .in-hero{position:relative;z-index:1}
@keyframes drift{to{transform:translateX(-50%)}}
.saldo{display:flex;align-items:center;justify-content:space-between;gap:12px}
.saldo .amt{font-size:26px}
.pos{color:var(--ok)} .neg{color:var(--bad)}

/* ---------- balances ---------- */
.bal{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.bal:last-child{border-bottom:0}
.bar{height:6px;border-radius:3px;background:var(--surface-2);position:relative;margin-top:6px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.bar i.p{left:50%;background:var(--ok)} .bar i.n{right:50%;background:var(--bad)}
.tx{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tx:last-child{border-bottom:0}

/* ---------- tareas ---------- */
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;align-items:start}
.col h3{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tcard{background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);border:0;width:100%;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.tcard .t{font-weight:700}
.tcard.done .t{text-decoration:line-through;color:var(--ink-3)}
.prog{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}.prog i{display:block;height:100%;background:var(--tide)}
.sub-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sub-item input{width:22px;height:22px;accent-color:var(--tide)}

/* ---------- eventos ---------- */
.day{margin-top:18px}
.day-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.day-h b{font-family:var(--f-disp);font-size:20px}
.ev{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);border:0;width:100%;text-align:left;cursor:pointer}
.ev .blk{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding-top:3px}
.ev.noche{background:linear-gradient(135deg,var(--surface) 55%,var(--sun-soft))}
.ev .t{font-family:var(--f-disp);font-weight:700;font-size:17px;line-height:1.2}
.prop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.vote{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:56px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-weight:800;color:var(--ink-2)}
.vote svg{width:20px;height:20px}
.vote[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}

/* ---------- nosotros ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);border:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--sun);background:var(--sun-soft);border-radius:999px;padding:2px 8px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:15px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}

/* ---------- hoja inferior ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--scrim)}
.sheet-card{position:relative;width:100%;max-width:680px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sheet-h h2{flex:1;font-size:22px}
.x{border:0;background:var(--surface-2);width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.x svg{width:20px;height:20px}
.add-opt{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:0;border-radius:14px;padding:12px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.add-opt .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tide-soft);color:var(--tide-deep)}
.add-opt .ic.s{background:var(--sun-soft);color:var(--sun)}
.add-opt .ic svg{width:22px;height:22px}
.add-opt b{display:block}
.thumb{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:var(--surface-2)}
.pin-big{font-family:var(--f-disp);font-weight:800;font-size:56px;letter-spacing:.2em;text-align:center;color:var(--tide)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.table-x{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}

/* ---------- carta de comida ---------- */
.carta{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.carta-t{font-size:22px;margin-top:2px;line-height:1.15}
.plato{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border:0;border-bottom:1px dashed var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:inherit}
.plato:last-of-type{border-bottom:0}
.plato-n{font-family:var(--f-disp);font-weight:700;font-size:17px;line-height:1.2}
.plato-d{font-size:14px;color:var(--ink-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pv{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;overflow:hidden;flex:none}
.pv svg{width:28px;height:28px}.pv img{width:100%;height:100%;object-fit:cover}
.pv.sm{width:40px;height:40px;border-radius:10px}.pv.sm svg{width:20px;height:20px}
.pv.lg{width:100%;height:200px;border-radius:18px}.pv.lg svg{width:56px;height:56px}
.meal{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;border:1px dashed var(--line);background:none;border-radius:14px;padding:8px 12px;width:100%;text-align:left;cursor:pointer;color:inherit}
.pbar{height:10px;border-radius:5px;background:var(--surface-2);position:relative;overflow:hidden;margin-top:8px}
.pbar .band{position:absolute;top:0;bottom:0;background:var(--tide-soft)}
.pbar .fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px;background:var(--tide)}.pbar .fill.over{background:var(--bad)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.foto{border:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;text-align:left;display:flex;flex-direction:column;color:inherit}
.foto img,.foto .pv{width:100%;height:150px;object-fit:cover;border-radius:0}
.foto .cap{padding:8px 10px;font-size:13px;color:var(--ink-2)}
.swatch{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);flex:none}
.insp{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:12px}
.insp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.insp-add{aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-2);font-size:12px;text-align:center;cursor:pointer;padding:6px}
.insp-add svg{width:22px;height:22px}
.seg.sm4 button{font-size:13px;padding:0 4px}

/* ---------- itinerario tipo app de crucero ---------- */
.ahora{margin-top:14px;background:linear-gradient(135deg,var(--surface) 40%,var(--tide-soft))}
.ah-t{font-family:var(--f-disp);font-weight:800;font-size:19px;line-height:1.2;margin-top:2px}
.day-tema{display:flex;align-items:center;gap:4px;margin:-2px 0 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.day-tema i{width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}.day-tema span{margin-left:6px}
.tl{position:relative;padding-left:14px}.tl::before{content:"";position:absolute;left:3px;top:8px;bottom:8px;width:2px;border-radius:1px;background:var(--line)}
.tl>*{position:relative}.tl>*::before{content:"";position:absolute;left:-15px;top:18px;width:8px;height:8px;border-radius:50%;background:var(--tide);box-shadow:0 0 0 3px var(--bg)}
/* ---------- álbum ---------- */
.alb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.alb button{aspect-ratio:1;border:0;padding:0;overflow:hidden;border-radius:8px;background:var(--surface-2);cursor:pointer}
.alb img{width:100%;height:100%;object-fit:cover;display:block}
.lb img{width:100%;max-height:70vh;object-fit:contain;border-radius:16px;background:var(--ink)}
/* ---------- lo esencial ---------- */
.esen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.esen button span:last-child{font-size:12px;line-height:1.15;text-align:center}
.esen button{background:var(--surface);border:0;border-radius:14px;box-shadow:var(--shadow);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
.esen .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--tide-soft);color:var(--tide-deep)}.esen .ic svg{width:20px;height:20px}
/* ---------- gestión de invitados ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tiles div{background:var(--surface);border-radius:14px;padding:10px 8px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;text-align:center}
.tiles b{font-family:var(--f-disp);font-size:24px;line-height:1.1}.tiles span{font-size:11px;color:var(--ink-2);font-weight:600}
/* ---------- la casa ---------- */
.hero.con-foto{min-height:220px;display:flex;align-items:flex-end}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero.con-foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,20,24,.05) 30%,rgba(4,20,24,.7));z-index:0}
.hero.con-foto .in-hero{z-index:2;color:#fff}.hero.con-foto .wave{z-index:1}
.casa-g{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.casa-g::-webkit-scrollbar{display:none}
.casa-g img{flex:none;width:85%;max-width:520px;aspect-ratio:4/3;object-fit:cover;border-radius:16px;scroll-snap-align:center}
/* ---------- login ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-inline:20px;padding-block:32px;max-width:420px;margin:0 auto;gap:22px}
.login h1{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.03em}
.login .tag{font-size:17px;color:var(--ink-2)}
.pin-in{letter-spacing:.5em;font-size:24px;text-align:center;font-family:var(--f-disp);font-weight:700}

/* ============================================================================
   CÁLCULOS (iguales a las vistas SQL vw_gasto_partes / vw_balances / vw_fondo)
   ============================================================================ */
function partesDe(g){
  const ps=(g.reparto&&g.reparto.partes)||[]; const n=ps.length; if(!n) return [];
  const modo=g.reparto.modo, m=+g.monto||0;
  if(modo==='igual'){const base=Math.floor(m*100/n)/100; const resto=r2(m-base*n); return ps.map((p,i)=>({id:p.persona_id,v:i===0?r2(base+resto):base}))}
  if(modo==='porcentaje') return ps.map(p=>({id:p.persona_id,v:r2(m*(+p.valor||0)/100)}));
  return ps.map(p=>({id:p.persona_id,v:r2(+p.valor||0)}));
}
function miParte(g){const x=partesDe(g).find(p=>p.id===ME.id);return x?x.v:0}
/* lo que este gasto me deja: + me deben (presté), − debo. Igual que la columna derecha de Splitwise */
function miNeto(g){if(g.eliminado||g.fondo)return 0;const pague=(g.pagadores||[]).filter(x=>x.persona_id===ME.id).reduce((a,x)=>a+(+x.monto||0),0);return r2(pague-miParte(g))}
function balances(){
  const B={}; activos().forEach(p=>B[p.id]={id:p.id,pagado:0,toca:0});
  for(const g of GASTOS){ if(g.eliminado||g.fondo) continue;
    for(const x of (g.pagadores||[])){ if(!B[x.persona_id]) B[x.persona_id]={id:x.persona_id,pagado:0,toca:0}; B[x.persona_id].pagado=r2(B[x.persona_id].pagado+(+x.monto||0)) }
    for(const x of partesDe(g)){ if(!B[x.id]) B[x.id]={id:x.id,pagado:0,toca:0}; B[x.id].toca=r2(B[x.id].toca+x.v) }
  }
  return Object.values(B).map(b=>({...b,saldo:r2(b.pagado-b.toca)}));
}
function simplificar(bs){
  const deb=bs.filter(b=>b.saldo<-0.009).map(b=>({id:b.id,s:-b.saldo})).sort((a,b)=>b.s-a.s);
  const acr=bs.filter(b=>b.saldo>0.009).map(b=>({id:b.id,s:b.saldo})).sort((a,b)=>b.s-a.s);
  const out=[]; let i=0,j=0;
  while(i<deb.length&&j<acr.length){const m=Math.min(deb[i].s,acr[j].s); if(m>0.009) out.push({de:deb[i].id,a:acr[j].id,monto:r2(m)}); deb[i].s-=m; acr[j].s-=m; if(deb[i].s<0.009)i++; if(acr[j].s<0.009)j++}
  return out;
}
function fondo(){
  let ap=0,ga=0; for(const g of GASTOS){ if(g.eliminado) continue; if(g.tipo==='aporte') ap+=+g.monto; if(g.fondo) ga+=+g.monto }
  return {aportado:r2(ap),gastado:r2(ga),disponible:r2(ap-ga)};
}

/* arma comidas y platos para los días del viaje. Puro: no toca el estado global */
function generarMenuBase({dias,eventos,gente,autor,conEstaciones}){
  const comidas=[],platos=[];
  const mk=(o,extra)=>({id:uid(),descripcion:'',estilo:'',porciones:null,alergenos:[],opcion:null,foto:null,permanente:false,turno:null,comida_id:null,creado_por:autor,...o,...extra});
  const cm=o=>({id:uid(),responsables:[],evento_id:null,notas:'',creado_por:autor,...o});
  if(conEstaciones) MENU_BASE.estaciones.forEach(e=>platos.push(mk(e,{permanente:true})));
  let k=0;
  dias.forEach((d,i)=>{
    const des=cm({dia:d,turno:'desayuno',titulo:'Desayuno dual',modalidad:'dual',hora:'08:30',notas:'Café pasado y fruta fresca todos los días.'});
    comidas.push(des); platos.push(mk(MENU_BASE.A[i%3],{comida_id:des.id,opcion:'A'})); platos.push(mk(MENU_BASE.B[i%4],{comida_id:des.id,opcion:'B'}));
    const alm=cm({dia:d,turno:'almuerzo',titulo:'Almuerzo costeño',modalidad:'cocinera',hora:'13:30',notas:'Lo prepara la cocinera local. Ceviche bar de entrada.'});
    comidas.push(alm); platos.push(mk(MENU_BASE.alm[i%4],{comida_id:alm.id}));
    const evN=eventos.find(e=>e.dia===d&&e.bloque==='noche'&&MENU_BASE.cenas[e.titulo]);
    const libre=!evN&&i===dias.length-1&&dias.length>2;
    const titulo=evN?evN.titulo:libre?'Cena libre o restaurante del pueblo':'Picadas y hamburguesas caseras';
    const resp=libre||!gente.length?[]:[0,1,2].map(()=>gente[(k++)%gente.length]);
    const cen=cm({dia:d,turno:'cena',titulo,modalidad:libre?'libre':'colaborativa',hora:evN&&evN.hora?evN.hora:'20:00',responsables:resp,evento_id:evN?evN.id:null,notas:libre?'Cada quien elige; se puede reservar un restaurante en Same o en Tonsupa.':'Cocinan los responsables; los demás ayudan a lavar.'});
    comidas.push(cen); (MENU_BASE.cenas[titulo]||[]).forEach(p=>platos.push(mk(p,{comida_id:cen.id})));
  });
  return {comidas,platos};
}

function buscarPersonas(txt){
  const t=norm(txt); if(!t) return {ids:[],dudas:[]};
  const ids=[],dudas=[];
  for(const trozo of t.split(/,| y | e /).map(s=>s.trim()).filter(Boolean)){
    const c=activos().filter(p=>{const n=norm(p.nombre),a=norm(p.apodo||'').replace(/[^a-z ]/g,'').trim();return n===trozo||a===trozo||n.split(' ')[0]===trozo||(a&&a.split(' ')[0]===trozo)||n.startsWith(trozo+' ')});
    if(c.length===1) ids.push(c[0].id); else if(c.length>1) dudas.push(`"${trozo}" puede ser ${c.map(p=>p.nombre).join(', ')}: elige a mano`);
    else if(/^nati/.test(trozo)) dudas.push(`"${trozo}" puede ser cualquiera de las Natalias: elige a mano`);
  }
  return {ids,dudas};
}
function leerLocal(texto,conFoto,modo){
  const t=String(texto||'').trim(), prop={gastos:[],tareas:[],eventos:[],resumen:'',local:true};
  const mm=t.match(/(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?)/);
  if(modo!=='tareas'&&(mm||conFoto||modo==='gasto')){
    let monto=mm?leerMonto(mm[1]):0;
    let desc=''; const dm=t.match(/(?:\bde\b|\ben\b|\bpor\b|\bpara la\b)\s+([^,.;]+?)(?=\s*(?:,|\.|;|$|\bpara\b|\bva\b|\bmenos\b|\bsin\b|\bexcepto\b|\bentre\b))/i);
    if(dm) desc=dm[1].replace(/\b(d[oó]lares|usd|pesos|plata)\b/ig,'').trim();
    if(!desc) desc=t.replace(mm?mm[0]:'','').replace(/\b(pagu[ée]|pag[óo]|d[oó]lares|usd|\$)\b/ig,'').replace(/\s+/g,' ').trim().slice(0,50);
    desc=desc.charAt(0).toUpperCase()+desc.slice(1);
    const dudas=[]; let pagador=ME.id;
    const pm=t.match(/\bpag[óo]\s+([a-záéíóúñ ]+?)(?=\s*(?:,|\.|$|\d|\bde\b|\ben\b|\bpor\b))/i);
    if(pm){const r=buscarPersonas(pm[1]);if(r.ids[0])pagador=r.ids[0];dudas.push(...r.dudas)}
    let part=activos().map(p=>p.id);
    const sm=t.match(/\b(?:solo|s[oó]lo|entre)\s+([a-záéíóúñ ,]+?)(?=\s*(?:\.|;|$|\bmenos\b))/i);
    if(sm){const r=buscarPersonas(sm[1]);if(r.ids.length){part=r.ids;if(!part.includes(pagador)&&/\bentre\b/i.test(sm[0]))part.push(pagador)}dudas.push(...r.dudas)}
    const xm=t.match(/\b(?:menos|sin|excepto|salvo)\s+([a-záéíóúñ ,]+?)(?=\s*(?:\.|;|$))/i);
    if(xm){const r=buscarPersonas(xm[1]);part=part.filter(id=>!r.ids.includes(id));dudas.push(...r.dudas)}
    const cat=categoriaDe(t);
    if(!monto) dudas.push(conFoto?'Sin conexión a la IA todavía: escribe el total de la factura.':'No encontré el monto: escríbelo.');
    prop.gastos.push({descripcion:desc||'Gasto',monto,fecha:null,categoria:cat,pagador_ids:[pagador],participante_ids:part,modo:'igual',partes:null,evento_id:null,etiquetas:[],confianza:monto?0.7:0.1,dudas});
    prop.resumen='Lectura rápida en el teléfono (sin IA). Revisa antes de guardar.';
  } else if(t){
    partirTareas(t).forEach(s=>{let resp=null;const rm=s.match(/^([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)\s+(?=(prende|lleva|compra|trae|hace|arma|cocina|maneja|organiza|consigue|reserva))/);if(rm){const r=buscarPersonas(rm[1]);resp=r.ids[0]||null}
      const ev=EVENTOS.find(e=>e.id===eventoDe(s));
      prop.tareas.push({titulo:s,detalle:null,grupo:grupoDe(s),prioridad:/urgente|ya mismo|\bhoy\b|importante|antes de/i.test(s)?'alta':'media',responsable_id:resp,fecha:ev&&ev.dia||null,evento_id:ev?ev.id:null,etiquetas:[],subtareas:[]})});
    prop.resumen=`Encontré ${prop.tareas.length} tarea${prop.tareas.length===1?'':'s'}. Marca las que quieres crear.`;
  }
  return prop;
}
/* "1.250,50" · "1,250.50" · "45,50" · "1.250" → número. El último separador con 1-2 decimales es el decimal. */
function leerMonto(s){const pt=s.lastIndexOf('.'),cm=s.lastIndexOf(',');
  if(pt>=0&&cm>=0){const dec=pt>cm?'.':',';s=s.split(dec==='.'?',':'.').join('');s=s.replace(dec,'.')}
  else{const sep=pt>=0?'.':cm>=0?',':'';if(sep){const partes=s.split(sep);s=(partes.length>2||partes[partes.length-1].length===3)?partes.join(''):partes.join('.')}}
  return r2(parseFloat(s)||0)}
const VERBOS='llevar|comprar|traer|armar|hacer|conseguir|reservar|limpiar|preparar|cocinar|organizar|pagar|alquilar|cargar|pedir|confirmar|buscar|lavar|contratar|imprimir';
/* "Comprar 3 fundas de hielo, carbón para el asado y llevar los micrófonos" → 3 tareas; la segunda hereda el verbo */
function partirTareas(t){
  const re=new RegExp('[;,]|\\s+y\\s+(?=(?:'+VERBOS+')\\b)','i'), rv=new RegExp('^('+VERBOS+')\\b','i');
  let items=t.includes('\n')?t.split('\n'):t.split(re);
  items=items.map(s=>(s||'').replace(/^\s*(?:[-–•*]|\d+[.)])\s*/,'').trim()).filter(s=>s.length>1);
  let verbo='';
  return items.map(s=>{const m=s.match(rv);if(m)verbo=m[1];else if(verbo&&!/^[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+\s+(?:prende|lleva|compra|trae|hace|arma|cocina|maneja|organiza)/.test(s))s=verbo.toLowerCase()+' '+s;return s.charAt(0).toUpperCase()+s.slice(1)});
}
const EV_CLAVES=[[/karaoke|microfono|proyector/,/karaoke/],[/asado|parrill|grill|carbon|taco/,/grill|parrill|asado|taco/],[/pizza|risk|monopol|juegos de mesa/,/pizza|juegos/],[/tapas|vino|hipnosis/,/tapas/],[/talento|talent/,/talent/],[/yoga/,/yoga/],[/gafas|sesion de fotos/,/fotos/],[/panzazo|piscina/,/panzazo/],[/intenciones|fogata/,/intenciones/]];
function eventoDe(txt){const t=norm(txt);for(const[q,e]of EV_CLAVES)if(q.test(t)){const ev=EVENTOS.find(x=>x.estado!=='cancelado'&&e.test(norm(x.titulo+' '+(x.tematica||''))));if(ev)return ev.id}return null}
function categoriaDe(t){t=norm(t);
  if(/cocinera|sueldo/.test(t))return'cocinera';
  if(/hielo|cerveza|ron|trago|vino|whisky|aguardiente|michelada|bebida|cola|agua/.test(t))return'bebidas';
  if(/mercado|super|tienda|despensa|frutas|verdura|viveres/.test(t))return'despensa';
  if(/gasolina|taxi|uber|bus|peaje|parqueadero|vuelo|pasaje|carro/.test(t))return'transporte';
  if(/casa|hotel|airbnb|hospedaje|cabana|arriendo/.test(t))return'hospedaje';
  if(/lancha|tour|entrada|surf|snorkel|kayak|clase/.test(t))return'actividades';
  if(/parlante|microfono|proyector|carbon|gas|cooler|toldo|equipo/.test(t))return'logistica';
  if(/comida|almuerzo|cena|desayuno|taco|pizza|pescado|camaron|carne|asado|restaurante/.test(t))return'restaurantes';
  return'otros'}
function grupoDe(t){t=norm(t);
  if(/compra|comprar|mercado|super/.test(t))return'Compras';
  if(/cerveza|hielo|trago|ron|bebida/.test(t))return'Bebidas';
  if(/cocina|cocinar|carne|asado|desayuno|almuerzo|cena|comida|parrilla/.test(t))return'Comida';
  if(/limpiar|lavar|basura|casa|cuarto|camas/.test(t))return'Casa';
  if(/playlist|juego|karaoke|actividad|torneo|disfraz/.test(t))return'Actividades';
  return'Logística'}

function validarF(){
  const m=r2(parseFloat(String(F.monto).replace(',','.'))||0);
  if(!String(F.descripcion).trim()) return 'Falta la descripción';
  if(!(m>0)) return 'Escribe un monto mayor que cero';
  if(F.fondo&&F.tipo==='gasto') return '';
  if(!F.part.length) return 'Elige entre quiénes se reparte';
  if(F.modo==='porcentaje'){const s=r2(F.part.reduce((a,id)=>a+(+F.valores[id]||0),0));if(Math.abs(s-100)>0.01)return `Los porcentajes suman ${s}%, deben sumar 100%`}
  if(F.modo==='monto'){const s=r2(F.part.reduce((a,id)=>a+(+F.valores[id]||0),0));if(Math.abs(s-m)>0.01)return `Las partes suman ${money(s)}, deben sumar ${money(m)}`}
  return '';
}

function achicar(file,lado,q){return new Promise((ok,mal)=>{const r=new FileReader();r.onerror=()=>mal(new Error('No pude leer la foto'));r.onload=()=>{const im=new Image();im.onerror=()=>mal(new Error('Ese archivo no es una imagen'));im.onload=()=>{const k=Math.min(1,lado/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const dataUrl=c.toDataURL('image/jpeg',q);c.toBlob(blob=>ok({blob,dataUrl}),'image/jpeg',q)};im.src=r.result};r.readAsDataURL(file)})}

      <div class="field"><label for="tfe">Fecha</label><input id="tfe" type="date" class="in" value="${esc(t.fecha||'')}" onchange="TF.fecha=this.value||null"></div></div>
    <div class="field"><label for="tev">Evento</label><select id="tev" class="in" onchange="TF.evento_id=this.value||null"><option value="">Ninguno</option>${EVENTOS.filter(e=>e.estado!=='cancelado').map(e=>`<option value="${e.id}" ${t.evento_id===e.id?'selected':''}>${esc(e.titulo)}</option>`).join('')}</select></div>

async function guardarTarea(){if(!String(TF.titulo).trim()){toast('Escribe qué hay que hacer');return}const n=TF.nuevo;const t={...TF};delete t.nuevo;if(n)t.creado_por=ME.id;try{await API.saveTarea(t,n);await cargar();closeSheet();toast(n?'Tarea creada':'Tarea actualizada');render()}catch(e){toast(e.message)}}
function abrirTurnos(){
  const dias=diasViaje();
  openSheet(`${sheetH('Generar turnos')}<div class="stack"><p class="muted">Reparte los oficios de la casa rotando entre todos. Crea una tarea por turno, en el grupo Turnos.</p>
    ${dias.length?'':`<div class="banner warn">Primero pon las fechas del viaje en Admin.</div>`}
    <div class="field"><label for="tro">Turnos de cada día (uno por línea)</label><textarea id="tro" class="in" rows="5">Desayuno
Lavar platos
Hielo y mercado
Sacar la basura</textarea></div>
    <div class="field"><label for="tpp">Personas por turno</label><input id="tpp" class="in" type="number" min="1" max="4" value="2"></div>

async function generarTurnos(){
  const roles=$('#tro').value.split('\n').map(s=>s.trim()).filter(Boolean), k=Math.max(1,Math.min(4,+$('#tpp').value||1)), gente=activos().map(p=>p.id);
  let i=0, n=0;
  try{for(const d of diasViaje())for(const r of roles){const quienes=Array.from({length:k},()=>gente[(i++)%gente.length]);await API.saveTarea({id:uid(),titulo:`${r} · ${diaSem(d)} ${fechaCorta(d)}`,detalle:`Con ${quienes.slice(1).map(nom).join(', ')||'—'}`,grupo:'Turnos',estado:'por_hacer',responsable:quienes[0],evento_id:null,fecha:d,etiquetas:[],subtareas:quienes.slice(1).map(q=>({txt:'Ayuda: '+nom(q),ok:false})),creado_por:ME.id},true);n++}
    await cargar();closeSheet();toast(`${n} turnos creados`);FILTT.grupo='Turnos';render()}catch(e){toast(e.message)}
}

  return `<button class="ev ${e.bloque==='noche'?'noche':''}" onclick="abrirEvento('${e.id}')"><div class="blk">${BLOQN[e.bloque]||'—'}${e.hora?`<br>${esc(String(e.hora).slice(0,5))}`:''}</div>

    <div class="row wrap-ok" style="gap:6px;margin-top:6px">${e.dress_code?`<span class="pill sun">${esc(e.dress_code)}</span>`:''}${e.lugar?`<span class="pill">${esc(e.lugar)}</span>`:''}${e.estado==='hecho'?'<span class="pill ok">Hecho</span>':''}${vs?`<span class="pill ${e.estado==='propuesta'?'':'ok'}">${vs} ${e.estado==='propuesta'?'votos':'van'}</span>`:''}${e.estado!=='propuesta'&&voyA(e)?'<span class="pill sun">En tu agenda</span>':''}</div>
    ${menuDeEvento(e).length?`<div class="tiny" style="margin-top:6px"><b>Menú:</b> <span class="muted">${menuDeEvento(e).map(esc).join(' · ')}</span></div>`:''}
    ${(e.anfitriones||[]).length?`<div class="row" style="margin-top:8px"><div class="avs">${e.anfitriones.map(a=>av(a,'xs')).join('')}</div><span class="tiny muted">anfitriones</span></div>`:''}</div></button>`}
function vPlanes(){
  const props=EVENTOS.filter(e=>e.estado==='propuesta').sort((a,b)=>votosDe(b.id).length-votosDe(a.id).length);
  return `<div class="seg"><button aria-pressed="${SUBE==='programa'}" onclick="SUBE='programa';render()">Itinerario</button><button aria-pressed="${SUBE==='dress'}" onclick="SUBE='dress';render()">Dress code</button><button aria-pressed="${SUBE==='propuestas'}" onclick="SUBE='propuestas';render()">Propuestas · ${props.length}</button></div>
  ${SUBE==='programa'?vPrograma():SUBE==='dress'?vDress():`<p class="muted tiny" style="margin-top:12px">Vota las que te gustan. ${esAdmin()?'Tú decides cuáles pasan al programa.':'Daniel pasa las más votadas al programa.'}</p>
    <div class="stack">${props.map(e=>{const vs=votosDe(e.id),yo=vs.some(v=>v.persona_id===ME.id);return `<div class="card prop"><button style="border:0;background:none;text-align:left;cursor:pointer;padding:0;min-width:0" onclick="abrirEvento('${e.id}')"><div class="eyebrow">${esc(e.tematica||'Plan')} · ${BLOQN[e.bloque]||''}</div><div style="font-family:var(--f-disp);font-weight:700;font-size:18px">${esc(e.titulo)}</div>
      <div class="muted tiny" style="margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(e.descripcion||'')}</div>${vs.length?`<div class="avs" style="margin-top:8px">${vs.slice(0,8).map(v=>av(v.persona_id,'xs')).join('')}</div>`:''}</button>
      <button class="vote" aria-pressed="${yo}" onclick="votar('${e.id}',${!yo})" aria-label="${yo?'Quitar voto':'Votar'}">${ic('thumb')}<span class="num">${vs.length}</span></button></div>`}).join('')||`<div class="card flat empty">No hay propuestas. Toca ＋ para proponer un plan.</div>`}</div>`}`;
}
let MIAG=false;
const voyA=e=>votosDe(e.id).some(v=>v.persona_id===ME.id)||(e.anfitriones||[]).includes(ME.id);
/* "Ahora y lo siguiente", como la app del crucero el día de navegación */
function ahoraCard(){
  const dias=diasViaje(), hoy=hoyISO(); if(!dias.length) return '';
  if(!dias.includes(hoy)){const n=difDias(hoy,dias[0]);if(n<0)return '';const pr=EVENTOS.filter(e=>e.estado==='oficial'&&e.dia===dias[0]).sort((a,b)=>minEv(a)-minEv(b))[0];
    return `<div class="card ahora"><div class="eyebrow">Zarpamos en ${n} día${n===1?'':'s'}</div><div class="ah-t">${pr?esc(pr.titulo):'Día 1 en '+esc(CFG.lugar||'la playa')}</div>${pr?`<div class="muted tiny">${diaSem(pr.dia)} ${fechaCorta(pr.dia)} · ${esc(String(pr.hora||BLOQN[pr.bloque]||'').slice(0,5))}${pr.lugar?' · '+esc(pr.lugar):''}</div>`:''}</div>`}
  const ahora=new Date().getHours()*60+new Date().getMinutes();
  const L=[...EVENTOS.filter(e=>(e.estado==='oficial'||e.estado==='hecho')&&e.dia===hoy).map(e=>({m:minEv(e),t:e.titulo,l:e.lugar,id:e.id,k:'e'})),...comidasDia(hoy).map(c=>({m:minDe(c.hora)??510,t:TURNON[c.turno]+': '+(platosDe(c.id).map(p=>p.nombre)[0]||c.titulo),l:'casa',id:c.id,k:'c'}))].sort((a,b)=>a.m-b.m);
  const act=L.filter(x=>x.m<=ahora).pop(), sig=L.find(x=>x.m>ahora);
  const hh=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  return `<div class="card ahora"><div class="row" style="align-items:flex-start;gap:16px">
    <div class="grow"><div class="eyebrow">Ahora</div><div class="ah-t">${act?esc(act.t):'Mañana libre'}</div>${act&&act.l?`<div class="muted tiny">${esc(act.l)}</div>`:''}</div>
    <div class="grow"><div class="eyebrow">Lo siguiente${sig?' · '+hh(sig.m):''}</div><div class="ah-t">${sig?esc(sig.t):'Nada más hoy'}</div>${sig&&sig.m-ahora<=90?`<span class="pill sun">en ${sig.m-ahora} min</span>`:''}</div></div></div>`;
}
function vPrograma(){
  const dias=diasViaje(), of=EVENTOS.filter(e=>(e.estado==='oficial'||e.estado==='hecho')&&(!MIAG||voyA(e)));
  const sinDia=of.filter(e=>!e.dia||!dias.includes(e.dia));
  if(!dias.length&&!of.length) return `<div class="card flat empty" style="margin-top:14px">${ic('planes')}<div>Todavía no hay fechas ni planes oficiales.${esAdmin()?' Pon las fechas en Admin y pasa propuestas al programa.':''}</div></div>`;
  return ahoraCard()+`<div class="row wrap-ok" style="margin-top:12px"><button class="chip" aria-pressed="${!MIAG}" onclick="MIAG=false;render()">Todo el viaje</button><button class="chip sunny" aria-pressed="${MIAG}" onclick="MIAG=true;render()">Mi agenda</button></div>`
  +dias.map((d,i)=>{const E=of.filter(e=>e.dia===d), C=comidasDia(d).filter(c=>!EVENTOS.some(e=>e.id===c.evento_id&&e.dia===d&&E.includes(e))&&(!MIAG||miAsis(c.id).va!==false));
    const noche=EVENTOS.find(e=>e.dia===d&&e.bloque==='noche'&&(e.estado==='oficial'||e.estado==='hecho')&&e.estilo);
    const L=[...E.map(e=>({m:minEv(e),h:evCard(e)})),...C.map(c=>({m:minDe(c.hora)??({desayuno:510,almuerzo:810,cena:1200}[c.turno]),h:mealRow(c)}))].sort((a,b)=>a.m-b.m);
    return `<div class="day"><div class="day-h"><b>Día ${i+1}</b><span class="muted">${diaSem(d)} ${fechaCorta(d)}</span>${d===hoyISO()?'<span class="pill sun">Hoy</span>':''}</div>
      ${noche?`<div class="day-tema">${(noche.estilo.paleta||[]).filter(hexOk).slice(0,4).map(c=>`<i style="background:${c}"></i>`).join('')}<span>${esc(noche.estilo.nombre)}</span></div>`:''}
      ${L.length?`<div class="stack tl">${L.map(x=>x.h).join('')}</div>`:`<div class="muted tiny" style="padding:4px 2px">Libre. Playa y siesta.</div>`}</div>`}).join('')
    +(sinDia.length?`<div class="day"><div class="day-h"><b>Por programar</b></div><div class="stack">${sinDia.map(evCard).join('')}</div></div>`:'');
}
async function votar(id,si){try{await API.votar(id,si);await cargar();render()}catch(e){toast(e.message)}}

    ${(()=>{const st=e.estilo;return st&&(st.paleta||[]).filter(hexOk).length?`<div class="card"><div class="eyebrow">Dress code · ${esc(st.nombre||e.dress_code)}</div><div class="row" style="gap:6px;margin-top:8px">${st.paleta.filter(hexOk).map(c=>`<span class="swatch" style="background:${c}"></span>`).join('')}</div>${st.descripcion?`<p class="muted tiny" style="margin:8px 0 0">${esc(st.descripcion)}</p>`:''}<button class="btn ghost sm" style="padding:0" onclick="SUBE='dress';closeSheet();irA('planes')">Ver inspiración</button></div>`:''})()}
    ${(()=>{const c=COMIDAS.find(x=>x.evento_id===e.id);if(c)return `<div class="card"><div class="eyebrow" style="margin-bottom:4px">Menú de la noche</div>${platosDe(c.id).map(platoRow).join('')}<button class="btn ghost sm" style="padding:0" onclick="DIA_MENU='${c.dia}';SUBM='carta';closeSheet();irA('menu')">Ver en la carta</button></div>`;
      return (e.menu||[]).length?`<div class="card"><div class="eyebrow" style="margin-bottom:6px">Menú</div>${e.menu.map(m=>`<div style="padding:5px 0;border-bottom:1px solid var(--line)">${esc(m)}</div>`).join('')}</div>`:puedeEditarEv(e)?`<button class="btn block" onclick="abrirFormEvento('${e.id}')">Agregar el menú</button>`:''})()}
    ${/talent/i.test(e.titulo+' '+(e.tematica||''))?(()=>{const ts=activos().filter(p=>p.perfil&&p.perfil.talento);return `<div class="card"><div class="eyebrow" style="margin-bottom:6px">Programa del show</div>${ts.length?ts.map(p=>`<div class="row" style="padding:5px 0">${av(p.id,'xs')}<b>${esc(nom(p.id))}</b><span class="muted grow">${esc(p.perfil.talento)}</span></div>`).join(''):'<div class="muted tiny">Nadie ha anotado su talento todavía. Se anota en "Mi ficha".</div>'}</div>`})():''}

    <div class="card"><div class="eyebrow" style="margin-bottom:4px">Lo que hay que llevar o comprar</div>

    ${esAdmin()&&e.estado==='propuesta'?`<div class="card"><div class="eyebrow" style="margin-bottom:8px">Pasar al programa</div>${selectorDia(e)}<button class="btn primary block" style="margin-top:10px" onclick="hacerOficial('${e.id}')">Hacer oficial</button></div>`:''}

function selectorDia(e){const dias=diasViaje();return `<div class="grid2"><div class="field"><label for="odia">Día</label><select id="odia" class="in">${dias.length?dias.map((d,i)=>`<option value="${d}" ${e.dia===d?'selected':''}>Día ${i+1} · ${diaSem(d)} ${fechaCorta(d)}</option>`).join(''):'<option value="">Sin fechas del viaje</option>'}</select></div>
  <div class="field"><label for="oblq">Momento</label><select id="oblq" class="in">${BLOQUES.map(([k,l])=>`<option value="${k}" ${e.bloque===k?'selected':''}>${l}</option>`).join('')}</select></div></div>`}
async function hacerOficial(id){await patchEvento(id,{estado:'oficial',dia:$('#odia').value||null,bloque:$('#oblq').value});toast('Pasó al programa')}
async function patchEvento(id,c,reabrir=true){const e=EVENTOS.find(x=>x.id===id);try{await API.saveEvento({...e,...c},false);await cargar();if(reabrir)abrirEvento(id);render()}catch(err){toast(err.message)}}
function toggleAnf(id){const e=EVENTOS.find(x=>x.id===id);const a=e.anfitriones||[];patchEvento(id,{anfitriones:a.includes(ME.id)?a.filter(x=>x!==ME.id):[...a,ME.id]})}
function checkLista(id,i,v){const e=EVENTOS.find(x=>x.id===id);patchEvento(id,{lista:(e.lista||[]).map((x,k)=>k===i?{...x,ok:v}:x)})}
function addLista(id){const v=$('#nli').value.trim();if(!v)return;const e=EVENTOS.find(x=>x.id===id);patchEvento(id,{lista:[...(e.lista||[]),{txt:v,ok:false}]})}
async function listaATareas(id){const e=EVENTOS.find(x=>x.id===id);const lista=[...(e.lista||[])];let n=0;
  try{for(const it of lista){if(it.tarea_id||it.ok)continue;const tid=uid();await API.saveTarea({id:tid,titulo:it.txt,detalle:'Para '+e.titulo,grupo:grupoDe(it.txt+' compra'),estado:'por_hacer',responsable:null,evento_id:e.id,fecha:e.dia||null,etiquetas:[],subtareas:[],creado_por:ME.id},true);it.tarea_id=tid;n++}
    await patchEvento(id,{lista});toast(`${n} tarea${n===1?' creada':'s creadas'}`)}catch(err){toast(err.message)}}
async function borrarEvento(id,btn){if(btn.dataset.ok!=='1'){btn.dataset.ok='1';btn.textContent='Toca otra vez para eliminar';return}try{await API.borrarEvento(id);await cargar();closeSheet();toast('Plan eliminado');render()}catch(e){toast(e.message)}}
function abrirFormEvento(id,pre){
  const e=id?EVENTOS.find(x=>x.id===id):{id:uid(),titulo:'',tematica:'',descripcion:'',bloque:'noche',lugar:'',dress_code:'',playlist_url:'',dia:null,hora:null,estado:'propuesta',anfitriones:[ME.id],etiquetas:[],lista:[],menu:[],...(pre||{})};
  window.EF={...e,nuevo:!id};

  const anf={};EVENTOS.forEach(e=>(e.anfitriones||[]).forEach(a=>anf[a]=(anf[a]||0)+1));const ta=Object.entries(anf).sort((a,b)=>b[1]-a[1])[0];if(ta&&ta[1]>1)add(ta[0],'Anfitrión estrella');

}

function detectarAlergenos(txt){
  let t=norm(txt); const s=new Set();
  if(/mariscos? oscuros?/.test(t)){s.add('oscuros');t=t.replace(/mariscos? oscuros?/g,' ')}
  if(/concha|mejillon|almeja|ostion|ostra/.test(t)){s.add('conchas');s.add('oscuros')}
  if(/camaron|langost|pulpo|calamar|marisc|cangrejo|jaiba|marinero|percebe/.test(t))s.add('mariscos');
  if(/pescado|corvina|dorado|atun|tilapia|picudo|robalo|bacalao|encocado de pescado/.test(t))s.add('pescado');
  if(/chicharron|cerdo|chancho|tocino|jamon|chorizo|bondiola|salchich|embutido/.test(t)){s.add('cerdo');s.add('carne')}
  if(/pollo|\bres\b|carne|lomo|costilla|parrillada|hamburgues/.test(t))s.add('carne');
  if(/queso|leche(?! de coco)|yogur|mantequilla|crema|manjar|mozzarella|helado/.test(t))s.add('lacteos');
  if(/harina|\bpan\b|pizza|pancake|panqueque|trigo|tostada|toast|pasta|galleta|masa|avena|apanado|empanizado/.test(t))s.add('gluten');
  if(/huevo|tortilla espanola|mayonesa/.test(t))s.add('huevo');
  if(/\bmani\b|cacahuate/.test(t))s.add('mani');
  const sinAlc=/sin alcohol|alcohol free|free alcohol|cero alcohol|zero alcohol|0[.,]0|cerveza cero|mocktail/.test(t.replace(/-/g,' '));
  if(!sinAlc&&/cerveza|vino|\bron\b|tequila|margarita|sangria|whisky|aguardiente|licor|michelada|coctel|cocktail|shot|maridaje/.test(t))s.add('alcohol');
  return [...s];
}

const PASILLOS=[['Del mar',/camaron|pescado|concha|mejillon|calamar|pulpo|marisc|corvina|dorado|atun/],['Carnes',/pollo|\bres\b|carne|lomo|costilla|chorizo|chicharron|cerdo|jamon|embutido|tocino/],
  ['Lácteos y huevos',/queso|leche(?! de coco)|yogur|mantequilla|crema|huevo|mozzarella|manjar/],['Frutas y verduras',/papaya|sandia|banano|verde|maduro|platano|aguacate|limon|tomate|cebolla|pimiento|cilantro|culantro|naranj|fruta|frutos|\bcol\b|lechuga|choclo|mango|maracuya|uva|\bajo\b|\baji\b|ensalada|papas|romero|patacon|coco/],
  ['Bebidas',/cafe|vino|cerveza|jugo|agua|hielo|\bron\b|tequila|gaseosa|soda/],['Despensa',/./]];
function listaCompras(sel){
  const M=new Map(); const add=(txt,plato,veces=1)=>{const k=norm(txt).replace(/es$|s$/,'');if(!k)return;const o=M.get(k)||{txt,platos:new Set(),veces:0};o.veces+=veces;o.platos.add(plato);M.set(k,o)};
  COMIDAS.filter(c=>sel.includes(c.dia)&&c.modalidad!=='libre').forEach(c=>platosDe(c.id).forEach(p=>(p.ingredientes||[]).forEach(i=>add(i,p.nombre))));
  estaciones().forEach(p=>(p.ingredientes||[]).forEach(i=>add(i,p.nombre,sel.length)));
  const grupos=PASILLOS.map(([n])=>({n,items:[]}));
  [...M.values()].sort((a,b)=>a.txt.localeCompare(b.txt)).forEach(o=>{const i=PASILLOS.findIndex(([,re])=>re.test(norm(o.txt)));grupos[i].items.push(o)});
  return grupos.filter(g=>g.items.length);
}

  const u=t.match(/https:\/\/[^\s]*(?:maps|goo\.gl)[^\s]*/i);if(u)r.mapa_url=u[0];
  const ll=t.match(/(?:llevar|traer)[:\s]+([^\n.]+)/i);if(ll)r.que_llevar=ll[1].split(/,|\sy\s/).map(x=>x.trim()).filter(Boolean).map(x=>x.charAt(0).toUpperCase()+x.slice(1));
  const AM=[['piscina','Piscina'],['frente al mar|frente a la playa|acceso a la playa|vista al mar','Frente al mar'],['wifi','WiFi'],['cocina','Cocina equipada'],['parrilla|bbq|barbacoa','Parrilla'],['aire acondicionado','Aire acondicionado'],['estacionamiento|parqueadero','Estacionamiento'],['lavadora','Lavadora'],['jacuzzi|tina','Jacuzzi'],['tv|televis','TV'],['hamaca','Hamacas'],['terraza','Terraza']];
  AM.forEach(([re,l])=>{if(new RegExp(re).test(n))(r.amenidades=r.amenidades||[]).push(l)});
  const air=t.match(/https:\/\/(?:www\.)?airbnb\.[a-z.]+\/rooms\/\d+/i);if(air)r.airbnb_url=air[0];
  t.split('\n').forEach(l=>{if(/^\s*(no |prohibido|cada quien|favor |por favor|respetar)/i.test(l))r.reglas.push(l.trim());const tel=l.match(/\+?\d[\d\s-]{7,}\d/);if(tel){const nm=l.replace(tel[0],'').replace(/[:\-–·]+\s*$/,'').trim();if(nm)r.contactos.push({nombre:nm.slice(0,40),rol:'',tel:tel[0].trim()})}});
  return r}
